<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apartment #15 · 3D Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1115;
      --panel: #161a21;
      --panel-elev: #1b2028;
      --text: #e8eaed;
      --muted: #8b939e;
      --faint: #5c6570;
      --accent: #4f9fd4;
      --accent-soft: rgba(79, 159, 212, 0.14);
      --line: #2a313c;
      --danger: #c45c5c;
      --ok: #3d9a6a;
      --radius: 6px;
      --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: var(--font); -webkit-font-smoothing: antialiased;
    }
    #app {
      display: grid;
      grid-template-columns: 1fr 300px;
      height: 100%;
      min-height: 0;
      position: relative;
      transition: grid-template-columns 0.2s ease;
    }
    #app.panel-collapsed {
      grid-template-columns: 1fr 0;
    }
    #view { position: relative; min-width: 0; min-height: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute; left: 14px; top: 14px; z-index: 2;
      background: rgba(22, 26, 33, 0.92); border: 1px solid var(--line);
      padding: 10px 12px; max-width: 300px; border-radius: 8px;
      backdrop-filter: blur(8px);
    }
    #hud h1 { margin: 0 0 2px; font-size: 13px; font-weight: 650; letter-spacing: -0.01em; }
    #hud p { margin: 0; font-size: 11px; color: var(--muted); line-height: 1.4; }
    #hud a { color: var(--accent); text-decoration: none; }
    #hud a:hover { text-decoration: underline; }
    #hud .hud-mode { margin-top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
    #hud .hud-mode .ghost.on {
      border-color: #3a5a72; background: var(--accent-soft); color: #9ad0ef;
    }

    /* ——— View gizmo (XYZ + standard views) ——— */
    #viewGizmo {
      position: absolute; right: 14px; bottom: 14px; z-index: 3;
      width: 148px;
      background: rgba(22, 26, 33, 0.94);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
      user-select: none;
    }
    #viewGizmo[hidden] { display: none !important; }
    #viewGizmo .gizmo-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px; gap: 6px;
    }
    #viewGizmo .gizmo-head strong {
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--faint); font-weight: 650;
    }
    #viewGizmo .gizmo-xyz {
      display: flex; gap: 6px; align-items: center;
      font: 600 10px/1 "IBM Plex Mono", ui-monospace, monospace;
    }
    #viewGizmo .gizmo-xyz span { letter-spacing: 0.02em; }
    #viewGizmo .ax-x { color: #e57373; }
    #viewGizmo .ax-y { color: #81c784; }
    #viewGizmo .ax-z { color: #64b5f6; }
    #viewGizmo .gizmo-triad {
      width: 100%; height: 52px; margin-bottom: 6px;
      border-radius: 6px; background: #0e1218; border: 1px solid var(--line);
      display: grid; place-items: center;
    }
    #viewGizmo .gizmo-triad svg { width: 72px; height: 48px; }
    #viewGizmo .gizmo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }
    #viewGizmo .gizmo-grid button {
      border: 1px solid var(--line); background: #1a2029; color: var(--muted);
      font: inherit; font-size: 10px; font-weight: 600; padding: 7px 4px;
      border-radius: 5px; cursor: pointer; line-height: 1.1;
    }
    #viewGizmo .gizmo-grid button:hover {
      color: var(--text); border-color: #3a5a72; background: #222a36;
    }
    #viewGizmo .gizmo-grid button.on {
      color: #9ad0ef; border-color: #3a5a72; background: var(--accent-soft);
    }
    #viewGizmo .gizmo-grid .span2 { grid-column: span 2; }
    #viewGizmo .gizmo-grid .empty { visibility: hidden; pointer-events: none; }
    body.view-mode #viewGizmo { right: 14px; bottom: 48px; }
    @media (max-width: 720px) {
      #viewGizmo { right: 10px; bottom: 10px; width: 132px; padding: 6px; }
      #viewGizmo .gizmo-triad { height: 40px; }
    }
    #interactHint {
      position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
      z-index: 3; pointer-events: none;
      display: none; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 10px;
      background: rgba(16, 20, 28, 0.92); border: 1px solid var(--line);
      box-shadow: 0 10px 28px rgba(0,0,0,0.35); backdrop-filter: blur(8px);
      font-size: 12px; color: var(--text); white-space: nowrap;
    }
    #interactHint.show { display: flex; }
    #interactHint kbd {
      font: 600 11px/1 "IBM Plex Mono", ui-monospace, monospace;
      padding: 5px 7px; border-radius: 6px;
      background: #243041; border: 1px solid #3a4a5e; color: #e8eef7;
      min-width: 1.6em; text-align: center;
    }
    #interactHint .hint-label { color: var(--muted); }
    #interactHint .hint-action { color: var(--text); font-weight: 600; }
    #hud .hud-mode .walk-fov-chip {
      margin-top: 6px; width: 100%;
      border: 1px solid var(--line); background: #1a2029; color: var(--muted);
      padding: 6px 8px; border-radius: 6px; cursor: pointer;
      font: inherit; font-size: 11px; text-align: left;
    }
    #hud .hud-mode .walk-fov-chip:hover { color: var(--text); border-color: #3a4a5e; }

    /* ——— Right inspector panel ——— */
    #panel {
      border-left: 1px solid var(--line);
      background: var(--panel);
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
      font-size: 12px;
      transition: opacity 0.15s ease;
    }
    #app.panel-collapsed #panel {
      opacity: 0;
      pointer-events: none;
      border-left: 0;
      min-width: 0;
    }
    .panel-head {
      flex-shrink: 0;
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #1a1f27 0%, var(--panel) 100%);
    }
    .panel-head-top {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-bottom: 10px;
    }
    .panel-head-top h1 {
      margin: 0; font-size: 13px; font-weight: 650; letter-spacing: -0.01em;
      flex: 1; min-width: 0;
    }
    .panel-head-actions {
      display: flex; align-items: center; gap: 4px; flex-shrink: 0;
    }
    .panel-head-top .ghost {
      border: 0; background: transparent; color: var(--muted);
      font: inherit; font-size: 11px; cursor: pointer; padding: 4px 6px; border-radius: 4px;
    }
    .panel-head-top .ghost:hover { color: var(--text); background: #222831; }
    .panel-collapse-btn {
      width: 28px; height: 28px; border: 1px solid var(--line);
      background: #1a2029; color: var(--muted); border-radius: 6px;
      cursor: pointer; font: inherit; font-size: 14px; line-height: 1;
      display: grid; place-items: center; padding: 0;
    }
    .panel-collapse-btn:hover {
      color: var(--text); background: #222831; border-color: #3a4554;
    }
    .panel-edge-tab {
      position: absolute; z-index: 25; top: 50%; right: 0; transform: translateY(-50%);
      width: 22px; min-height: 72px; padding: 8px 0;
      border: 1px solid var(--line); border-right: 0;
      border-radius: 8px 0 0 8px;
      background: #1a2029; color: var(--muted);
      font: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
      cursor: pointer; display: none; align-items: center; justify-content: center;
      writing-mode: vertical-lr; text-orientation: mixed;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    .panel-edge-tab:hover {
      color: #9ad0ef; background: #1e2834; border-color: #3a5a72;
    }
    #app.panel-collapsed .panel-edge-tab { display: flex; }
    .seg {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0;
      border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
      background: #12151b;
    }
    .seg button {
      border: 0; background: transparent; color: var(--muted);
      padding: 7px 8px; font: inherit; font-size: 11px; font-weight: 550;
      cursor: pointer; transition: background 0.1s, color 0.1s;
    }
    .seg button + button { border-left: 1px solid var(--line); }
    .seg button:hover { color: var(--text); background: #1e2430; }
    .seg button.on {
      background: var(--accent-soft); color: #9ad0ef;
    }
    .panel-scroll {
      flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
      padding: 0 0 20px;
      scrollbar-width: thin;
      scrollbar-color: #2a3340 transparent;
    }
    .panel-scroll::-webkit-scrollbar { width: 5px; }
    .panel-scroll::-webkit-scrollbar-thumb { background: #2a3340; border-radius: 4px; }

    .panel-section {
      border-bottom: 1px solid var(--line);
    }
    .panel-section > summary {
      list-style: none; cursor: pointer; user-select: none;
      padding: 10px 14px;
      font-size: 10px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--faint);
      display: flex; align-items: center; justify-content: space-between;
    }
    .panel-section > summary::-webkit-details-marker { display: none; }
    .panel-section > summary::after {
      content: "▾"; font-size: 9px; color: var(--faint); transition: transform 0.15s;
    }
    .panel-section:not([open]) > summary::after { transform: rotate(-90deg); }
    .panel-section > summary:hover { color: var(--muted); background: #1a1f27; }
    .panel-section-body { padding: 0 14px 12px; }

    .empty-state {
      padding: 28px 18px; text-align: center; color: var(--muted);
    }
    .empty-state strong { display: block; color: var(--text); font-size: 13px; margin-bottom: 6px; font-weight: 600; }
    .empty-state p { margin: 0; font-size: 11px; line-height: 1.5; color: var(--faint); }

    .insp { padding: 12px 14px 14px; border-bottom: 1px solid var(--line); }
    .insp-title {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
      margin-bottom: 10px;
    }
    .insp-title h2 {
      margin: 0; font-size: 13px; font-weight: 650; letter-spacing: -0.01em;
      text-transform: none; color: var(--text);
    }
    .insp-title .kind-tag {
      flex-shrink: 0; font-size: 9px; font-weight: 650; letter-spacing: 0.06em;
      text-transform: uppercase; color: #9ad0ef;
      background: var(--accent-soft); border: 1px solid rgba(79,159,212,0.35);
      padding: 3px 6px; border-radius: 4px;
    }
    .insp-sub { margin: -4px 0 10px; font-size: 11px; color: var(--faint); }

    .field {
      display: grid; grid-template-columns: 88px 1fr; gap: 8px; align-items: center;
      min-height: 30px; margin-bottom: 6px;
    }
    .field-label {
      font-size: 11px; color: var(--muted); text-align: right; line-height: 1.2;
    }
    .field-ctrl { min-width: 0; }
    .field-ctrl input, .field-ctrl select {
      width: 100%; background: #0e1218; border: 1px solid var(--line); color: var(--text);
      padding: 5px 8px; font: inherit; font-size: 12px; border-radius: 4px;
      font-variant-numeric: tabular-nums;
    }
    .field-ctrl input:focus, .field-ctrl select:focus {
      outline: none; border-color: #3a5a72; box-shadow: 0 0 0 2px rgba(79,159,212,0.15);
    }
    .field-ctrl input[type="color"] {
      padding: 2px; height: 28px; cursor: pointer;
    }
    .field-pair {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    }

    .toolstrip {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px;
      padding-top: 10px; border-top: 1px solid var(--line);
    }
    .toolstrip button, button.ctrl, .chip {
      border: 1px solid var(--line); background: #1c222c; color: var(--text);
      padding: 5px 8px; font: inherit; font-size: 11px; font-weight: 500;
      cursor: pointer; border-radius: 4px; line-height: 1.2;
    }
    .toolstrip button:hover, button.ctrl:hover, .chip:hover {
      background: #252c38; border-color: #3a4554;
    }
    .toolstrip button.on, button.ctrl.on, .chip.on {
      background: var(--accent-soft); color: #9ad0ef; border-color: rgba(79,159,212,0.45);
    }
    .toolstrip button.danger {
      margin-left: auto; color: #e8a0a0; border-color: #5a3030; background: #2a1c1c;
    }
    .toolstrip button.danger:hover { background: #3a2424; }

    .transform-row {
      display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start;
      margin-top: 10px;
    }
    .move-pad {
      display: grid; grid-template-columns: repeat(3, 28px); gap: 3px;
    }
    .move-pad button {
      width: 28px; height: 26px; padding: 0; font-size: 11px;
      border: 1px solid var(--line); background: #1c222c; color: var(--muted);
      border-radius: 4px; cursor: pointer;
    }
    .move-pad button:hover { color: var(--text); background: #252c38; }
    .rot-btns { display: flex; flex-wrap: wrap; gap: 4px; }

    .list { display: flex; flex-direction: column; gap: 1px; }
    .list-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; border-radius: 4px; cursor: pointer;
      color: var(--text); font-size: 12px;
    }
    .list-row:hover { background: #1e2430; }
    .list-row.sel { background: var(--accent-soft); }
    .list-row .list-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list-row .list-meta { color: var(--faint); font-size: 10px; flex-shrink: 0; }
    .list-row button.ctrl {
      flex-shrink: 0; padding: 3px 7px; font-size: 10px;
    }
    .list-empty { color: var(--faint); font-size: 11px; padding: 4px 8px; }

    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { font-size: 10px; padding: 4px 8px; }

    .btn-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .btn-row button { font-size: 11px; padding: 5px 8px; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 10px; color: var(--muted); margin-top: 8px;
    }
    .status-pill i {
      width: 6px; height: 6px; border-radius: 50%; background: var(--faint);
      display: inline-block;
    }
    .status-pill.open i { background: var(--ok); }
    .field-ctrl input.mixed, .field-ctrl select.mixed {
      border-style: dashed; color: var(--faint);
    }
    .insp-chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 10px; }
    .insp-chips span {
      font-size: 10px; padding: 3px 7px; border-radius: 4px;
      background: #1c222c; border: 1px solid var(--line); color: var(--muted);
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .edit-bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-bottom: 10px;
    }
    .edit-bar button, .edit-bar .menu-trigger {
      border: 1px solid var(--line); background: #1c222c; color: var(--text);
      padding: 5px 8px; font: inherit; font-size: 11px; font-weight: 500;
      cursor: pointer; border-radius: 4px; line-height: 1.2;
    }
    .edit-bar button:hover:not(:disabled),
    .edit-bar .menu-trigger:hover { background: #252c38; border-color: #3a4554; }
    .edit-bar button:disabled { opacity: 0.35; cursor: default; }
    .edit-bar .edit-sep {
      width: 1px; align-self: stretch; background: var(--line); margin: 0 2px;
    }
    .menu { position: relative; display: inline-flex; }
    .menu-trigger {
      display: inline-flex; align-items: center; gap: 4px;
    }
    .menu-trigger::after {
      content: ""; width: 0; height: 0;
      border-left: 3.5px solid transparent; border-right: 3.5px solid transparent;
      border-top: 4px solid currentColor; opacity: 0.7; margin-top: 1px;
    }
    .menu.open > .menu-trigger {
      background: var(--accent-soft); color: #9ad0ef; border-color: rgba(79,159,212,0.45);
    }
    .menu-panel {
      display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 40;
      min-width: 150px; padding: 4px; flex-direction: column; gap: 1px;
      background: #1a2029; border: 1px solid var(--line); border-radius: 8px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.45);
    }
    .menu.open > .menu-panel { display: flex; }
    .menu-panel button {
      width: 100%; text-align: left; border: 0; background: transparent;
      color: var(--text); padding: 7px 10px; font: inherit; font-size: 12px;
      border-radius: 5px; cursor: pointer;
    }
    .menu-panel button:hover { background: #252c38; }
    .menu-panel .menu-sep { height: 1px; background: var(--line); margin: 4px 6px; }
    .model-pick {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px;
    }
    .model-pick .field { margin: 0; }

    #toasts {
      position: absolute; right: 14px; bottom: 14px; z-index: 5;
      display: flex; flex-direction: column; gap: 6px; pointer-events: none;
      max-width: min(320px, calc(100% - 28px));
    }
    .toast {
      background: rgba(22, 26, 33, 0.96); border: 1px solid var(--line);
      color: var(--text); font-size: 12px; padding: 8px 12px; border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    .toast.err { border-color: #5a3030; color: #e8a0a0; }
    .toast.ok { border-color: rgba(61,154,106,0.45); }

    #ctxMenu {
      position: fixed; z-index: 40; min-width: 198px;
      background: rgba(22, 26, 33, 0.98); border: 1px solid var(--line);
      border-radius: 8px; padding: 4px; box-shadow: 0 12px 32px rgba(0,0,0,0.45);
      backdrop-filter: blur(10px); display: none;
      font-size: 12px;
    }
    #ctxMenu.open { display: block; }
    #ctxMenu button {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      width: 100%; border: 0; background: transparent; color: var(--text);
      text-align: left; padding: 7px 10px; font: inherit; font-size: 12px;
      border-radius: 5px; cursor: pointer;
    }
    #ctxMenu button:hover:not(:disabled) { background: #252c38; }
    #ctxMenu button:disabled { color: var(--faint); cursor: default; }
    #ctxMenu button .kbd {
      color: var(--faint); font-size: 10px; font-family: var(--mono);
    }
    #ctxMenu .ctx-sep {
      height: 1px; background: var(--line); margin: 4px 6px;
    }
    #ctxMenu .ctx-label {
      padding: 6px 10px 2px; font-size: 10px; color: var(--faint);
      letter-spacing: 0.06em; text-transform: uppercase; font-weight: 650;
    }


    .panel-day {
      flex-shrink: 0;
      border-top: 1px solid var(--line);
      background: linear-gradient(0deg, #12161d 0%, var(--panel) 100%);
      padding: 10px 14px 12px;
    }
    .panel-day h3 {
      margin: 0 0 8px; font-size: 10px; font-weight: 650;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint);
      display: flex; justify-content: space-between; align-items: center;
    }
    .panel-day h3 .phase { letter-spacing: 0; text-transform: none; color: #9ad0ef; font-weight: 600; }
    .day-time-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .day-time-row[hidden], .day-live-row[hidden] { display: none !important; }
    .day-time-row input[type="range"] {
      flex: 1; accent-color: var(--accent); height: 4px; cursor: pointer;
    }
    .day-time-label {
      font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums;
      color: var(--text); min-width: 52px; text-align: right;
    }
    .day-sync {
      display: flex; align-items: center; gap: 8px;
      margin: 0 0 8px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none;
    }
    .day-sync input { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
    .day-live-row {
      display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      margin-bottom: 8px; padding: 8px 10px;
      background: #1a222c; border: 1px solid var(--line); border-radius: 6px;
    }
    .day-live-time {
      font-family: var(--mono); font-size: 22px; font-weight: 600;
      font-variant-numeric: tabular-nums; color: #e8eef6; letter-spacing: 0.04em;
    }
    .day-live-hint { font-size: 10px; color: var(--faint); }
    .day-meta {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px;
    }
    .day-meta label {
      display: flex; flex-direction: column; gap: 3px;
      font-size: 10px; color: var(--muted);
    }
    .day-meta select, .day-meta input {
      background: #0e1218; border: 1px solid var(--line); color: var(--text);
      padding: 4px 6px; font: inherit; font-size: 11px; border-radius: 4px;
    }
    .day-stats {
      font-size: 10px; color: var(--faint); line-height: 1.4;
      font-variant-numeric: tabular-nums;
    }
    body.view-mode #panel { max-width: 260px; }
    #shareWatermark {

import { createOpenhabClient } from "./openhab-bridge.js";
const __params = new URLSearchParams(location.search);
const SHARE_TOKEN = __params.get("t") || __params.get("share") || "";
const VIEW_MODE = __params.get("view") === "1" || !!SHARE_TOKEN;
const URL_MODEL = __params.get("model") || "";
if (URL_MODEL) Models.setActiveModelId(URL_MODEL);

installClientGuards({
  toast: (t, k) => { try { toast(t, k); } catch { /* */ } },
});

const M = 0.001;
const EP = 35; // mm endpoint match tolerance (general)
const JOIN_TOL = 100; // mm — snap / join walls that nearly meet

/** Soft real-world edges — nothing is razor-sharp. */
function boxGeo(w, h, d, radius) {
  const ww = Math.abs(w), hh = Math.abs(h), dd = Math.abs(d);
  const min = Math.min(ww, hh, dd);
  if (!(min > 0) || !Number.isFinite(min)) return new THREE.BoxGeometry(w, h, d);
  let r = radius;
  if (r == null) {
    // ~6–20 mm typical furniture edge, smaller on thin parts
    r = Math.min(0.02, Math.max(0.0025, min * 0.12));
  } else {
    r = Math.min(r, min * 0.45);
  }
  if (r < 0.0012) return new THREE.BoxGeometry(w, h, d);
  return new RoundedBoxGeometry(w, h, d, 3, r);
}

/** Plan mm → Three.js (Y-up): +planX → +X, +planY → −Z (matches CAD: X right, Y up). */
function px(x) { return x * M; }
function pz(y) { return -y * M; }
/** Shape XY before rotateX(-90°): shapeY becomes −worldZ, so use +planY to get worldZ = −planY. */
function shapeXY(x, y) { return [px(x), y * M]; }

const view = document.getElementById("view");
const panel = document.getElementById("panel");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12141a);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
camera.position.set(8, 14, 10);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(5.5, 0, -6);
controls.maxPolarAngle = Math.PI * 0.48;
controls.update();
const ORBIT_MAX_POLAR_DEFAULT = Math.PI * 0.48;

/* ——— View gizmo + ground grid ——— */
const viewGizmoEl = document.getElementById("viewGizmo");
let viewGizmoOn = false;
try {
  if (VIEW_MODE) viewGizmoOn = false;
  else viewGizmoOn = localStorage.getItem("a15-3d-view-gizmo") === "1";
} catch { /* */ }
let activeViewName = "";
let viewAnim = null; // { t0, dur, fromPos, toPos, fromTarget, toTarget, up }
let sceneGrid = null;
let sceneAxes = null;

function sceneFocusBox() {
  const box = new THREE.Box3().setFromObject(root);
  const center = new THREE.Vector3();
  const size = new THREE.Vector3();
  if (box.isEmpty()) {
    center.copy(controls.target);
    size.set(10, 3, 10);
  } else {
    box.getCenter(center);
    box.getSize(size);
  }
  const dist = Math.max(Math.max(size.x, size.y, size.z) * 1.35, 6);
  return { center, size, dist };
}

function disposeHelper(obj) {
  if (!obj) return;
  scene.remove(obj);
  obj.geometry?.dispose?.();
  const mats = obj.material;
  if (Array.isArray(mats)) mats.forEach((m) => m.dispose?.());
  else mats?.dispose?.();
}

function syncSceneGuides() {
  disposeHelper(sceneGrid);
  sceneGrid = null;
  disposeHelper(sceneAxes);
  sceneAxes = null;
  if (!viewGizmoOn || !doc) return;
  const { center, size } = sceneFocusBox();
  const extent = Math.max(size.x, size.z, 8);
  const divisions = Math.max(8, Math.min(40, Math.round(extent)));
  sceneGrid = new THREE.GridHelper(extent * 1.2, divisions, 0x3a4a5e, 0x252c38);
  sceneGrid.position.set(center.x, 0.002, center.z);
  sceneGrid.renderOrder = -2;
  scene.add(sceneGrid);
  const axisLen = Math.max(1.2, extent * 0.12);
  sceneAxes = new THREE.AxesHelper(axisLen);
  sceneAxes.position.set(center.x, 0.01, center.z);
  sceneAxes.renderOrder = -1;
  scene.add(sceneAxes);
}

function setViewGizmoEnabled(on, { quiet = false } = {}) {
  viewGizmoOn = !!on;
  try { localStorage.setItem("a15-3d-view-gizmo", viewGizmoOn ? "1" : "0"); } catch { /* */ }
  if (viewGizmoEl) viewGizmoEl.hidden = !viewGizmoOn;
  controls.maxPolarAngle = viewGizmoOn ? Math.PI - 0.02 : ORBIT_MAX_POLAR_DEFAULT;
  controls.minPolarAngle = 0;
  syncSceneGuides();
  syncHudMode();
  if (!quiet) toast(viewGizmoOn ? "View gizmo + grid on" : "View gizmo off");
}

function highlightViewButton(name) {
  activeViewName = name || "";
  viewGizmoEl?.querySelectorAll("[data-view]").forEach((btn) => {
    btn.classList.toggle("on", btn.dataset.view === activeViewName);
  });
}

function goStandardView(name) {
  if (walkthrough?.active) {
    toast("Exit walk mode first", "err");
    return;
  }
  if (name === "fit") {
    fitCamera();
    highlightViewButton("fit");
    return;
  }
  const { center, dist } = sceneFocusBox();
  const dirs = {
    top: { pos: new THREE.Vector3(0, 1, 0.0001), up: new THREE.Vector3(0, 0, -1) },
    bottom: { pos: new THREE.Vector3(0, -1, 0.0001), up: new THREE.Vector3(0, 0, 1) },
    front: { pos: new THREE.Vector3(0, 0.12, 1), up: new THREE.Vector3(0, 1, 0) },
    back: { pos: new THREE.Vector3(0, 0.12, -1), up: new THREE.Vector3(0, 1, 0) },
    right: { pos: new THREE.Vector3(1, 0.12, 0), up: new THREE.Vector3(0, 1, 0) },
    left: { pos: new THREE.Vector3(-1, 0.12, 0), up: new THREE.Vector3(0, 1, 0) },
    iso: { pos: new THREE.Vector3(0.7, 0.85, 0.7), up: new THREE.Vector3(0, 1, 0) },
  };
  const spec = dirs[name];
  if (!spec) return;
  if (name === "bottom" || name === "top") {
    controls.maxPolarAngle = Math.PI - 0.02;
  }
  const toPos = center.clone().add(spec.pos.clone().normalize().multiplyScalar(dist));
  viewAnim = {
    t0: performance.now(),
    dur: 320,
    fromPos: camera.position.clone(),
    toPos,
    fromTarget: controls.target.clone(),
    toTarget: center.clone(),
    up: spec.up.clone(),
  };
  camera.up.copy(spec.up);
  highlightViewButton(name);
  toast(name === "iso" ? "Isometric" : `${name[0].toUpperCase()}${name.slice(1)} view`);
}

function updateViewAnim(now) {
  if (!viewAnim) return;
  const u = Math.min(1, (now - viewAnim.t0) / viewAnim.dur);
  const e = 1 - (1 - u) ** 3;
  camera.position.lerpVectors(viewAnim.fromPos, viewAnim.toPos, e);
  controls.target.lerpVectors(viewAnim.fromTarget, viewAnim.toTarget, e);
  camera.up.copy(viewAnim.up);
  controls.update();
  if (u >= 1) viewAnim = null;
}

controls.addEventListener("start", () => {
  if (viewAnim) return;
  if (activeViewName === "top" || activeViewName === "bottom") {
    camera.up.set(0, 1, 0);
    highlightViewButton("");
  }
});
RectAreaLightUniformsLib.init();
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const ambLight = new THREE.AmbientLight(0xffffff, 0.08);
scene.add(ambLight);
const hemi = new THREE.HemisphereLight(0xb8d0f0, 0x3a3428, 0.28);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dd, 1.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 120;
sun.shadow.camera.left = -30;
sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30;
sun.shadow.camera.bottom = -30;
sun.shadow.bias = -0.00015;
sun.shadow.normalBias = 0.025;
sun.shadow.radius = 2;
scene.add(sun);
scene.add(sun.target);
const moon = new THREE.DirectionalLight(0xa8b8e8, 0.0);
scene.add(moon);
scene.add(moon.target);

const skyRoot = new THREE.Group();
scene.add(skyRoot);
const sunBody = new THREE.Mesh(
  new THREE.SphereGeometry(1.2, 24, 18),
  new THREE.MeshBasicMaterial({ color: 0xffe8a8 }),
);
const moonBody = new THREE.Mesh(
  new THREE.SphereGeometry(0.85, 20, 16),
  new THREE.MeshBasicMaterial({ color: 0xd8deef }),
);
skyRoot.add(sunBody, moonBody);

// Soft reflections — kept low so IBL doesn't wash through walls
const pmrem = new THREE.PMREMGenerator(renderer);
let envDayTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envDayTex;
if ("environmentIntensity" in scene) scene.environmentIntensity = 0.12;

const LOCATION_PRESETS = SITE_PRESETS;
let dayCycle = loadDayCycle();

function saveDayCycle() {
  persistDayCycleState(dayCycle);
  if (doc) {
    doc.site = {
      lat: dayCycle.lat,
      lon: dayCycle.lon,
      preset: dayCycle.preset,
      dayOfYear: dayCycle.dayOfYear,
      syncRealtime: !!dayCycle.syncRealtime,
    };
  }
}

function formatClock(hours) {
  const h = ((hours % 24) + 24) % 24;
  const hh = Math.floor(h);
  const mm = Math.round((h - hh) * 60) % 60;
  return `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
}

function formatClockLive(hours) {
  const h = ((hours % 24) + 24) % 24;
  const hh = Math.floor(h);
  const mFrac = (h - hh) * 60;
  const mm = Math.floor(mFrac) % 60;
  const ss = Math.floor((mFrac - Math.floor(mFrac)) * 60) % 60;
  return `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}`;
}

function updateDayTimeUiVisibility() {
  const sync = !!dayCycle.syncRealtime;
  const manual = document.getElementById("dayManualRow");
  const live = document.getElementById("dayLiveRow");
  const slider = document.getElementById("dayTime");
  if (manual) manual.hidden = sync;
  if (live) live.hidden = !sync;
  if (slider) slider.disabled = sync;
}

function kelvinToRgb(kelvin) {
  return kelvinToRgbShared(kelvin, THREE);
}

function lerpColor(a, b, t) {
  const c = a.clone();
  c.lerp(b, t);
  return c;
}

let lastDayStats = { elevDeg: 0, phase: "Day", moonElevDeg: 0 };

function sceneCenter() {
  if (!root.children.length) return { x: 5.5, z: -6 };
  const box = new THREE.Box3().setFromObject(root);
  if (box.isEmpty()) return { x: 5.5, z: -6 };
  const c = box.getCenter(new THREE.Vector3());
  return { x: c.x, z: c.z };
}

function updateDayCycle() {
  if (dayCycle.syncRealtime) syncHoursFromClock(dayCycle);

  const { elev, az } = solarCoords(dayCycle.lat, dayCycle.dayOfYear, dayCycle.hours);
  const elevDeg = elev * 180 / Math.PI;
  const center = sceneCenter();
  const dist = 48;
  const sx = Math.sin(az) * Math.cos(elev);
  const sy = Math.sin(elev);
  const sz = -Math.cos(az) * Math.cos(elev);
  sun.position.set(center.x + sx * dist, Math.max(sy * dist, -8), center.z + sz * dist);
  sun.target.position.set(center.x, 0, center.z);
  sun.target.updateMatrixWorld();
  sunBody.position.copy(sun.position);

  // Moon roughly opposite
  const moonElev = -elev;
  const moonAz = az + Math.PI;
  const mx = Math.sin(moonAz) * Math.cos(moonElev);
  const my = Math.sin(moonElev);
  const mz = -Math.cos(moonAz) * Math.cos(moonElev);
  moon.position.set(center.x + mx * dist, Math.max(my * dist, -6), center.z + mz * dist);
  moon.target.position.set(center.x, 0, center.z);
  moon.target.updateMatrixWorld();
  moonBody.position.copy(moon.position);

  const dayAmt = THREE.MathUtils.smoothstep(elevDeg, -6, 12);
  const duskAmt = 1 - THREE.MathUtils.smoothstep(Math.abs(elevDeg), 0, 10);
  const nightAmt = 1 - dayAmt;

  // Sun color: warm low, white high
  const sunK = THREE.MathUtils.lerp(2200, 5600, THREE.MathUtils.smoothstep(elevDeg, -2, 50));
  const sunCol = kelvinToRgb(sunK);
  if (elevDeg < 5) sunCol.lerp(new THREE.Color(0xff6a2a), duskAmt * 0.55);
  sun.color.copy(sunCol);
  sun.intensity = Math.max(0, Math.sin(Math.max(elev, 0))) * 1.65 + dayAmt * 0.15;
  sun.castShadow = elevDeg > -1;

  moon.color.set(0xb0c4f0);
  moon.intensity = nightAmt * Math.max(0, Math.sin(Math.max(moonElev, 0))) * 0.28;

  sunBody.visible = elevDeg > -8;
  moonBody.visible = elevDeg < 6;
  sunBody.material.color.copy(sunCol);
  const sunScale = 1.1 + dayAmt * 0.4;
  sunBody.scale.setScalar(sunScale);
  moonBody.scale.setScalar(0.9 + nightAmt * 0.2);

  // Sky background stays; interior fill is low — solid roof blocks overhead light
  const zenith = lerpColor(new THREE.Color(0x060812), new THREE.Color(0x87b7ef), dayAmt);
  zenith.lerp(new THREE.Color(0xc45a2a), duskAmt * (1 - dayAmt) * 0.65);
  const ground = lerpColor(new THREE.Color(0x0a0c10), new THREE.Color(0x4a4538), dayAmt);
  scene.background = zenith.clone();
  // Soft outdoor fill (kept modest so walls still read as solid under sun shadows)
  hemi.color.copy(zenith).multiplyScalar(0.85);
  hemi.groundColor.copy(ground);
  hemi.intensity = 0.12 + dayAmt * 0.28;
  ambLight.color.copy(lerpColor(new THREE.Color(0x1a2235), new THREE.Color(0xe8eef5), dayAmt));
  ambLight.intensity = 0.06 + dayAmt * 0.1 + nightAmt * 0.04;

  renderer.toneMappingExposure = 0.85 + dayAmt * 0.35 + nightAmt * 0.08;
  if ("environmentIntensity" in scene) scene.environmentIntensity = 0.15 + dayAmt * 0.25;

  lastDayStats = {
    elevDeg,
    moonElevDeg: moonElev * 180 / Math.PI,
    phase: dayPhaseLabel(elevDeg),
    azDeg: az * 180 / Math.PI,
  };

  // Live clock updates every frame when synced; other chrome ~4 Hz
  if (dayCycle.syncRealtime) {
    const live = document.getElementById("dayLiveClock");
    if (live) live.textContent = formatClockLive(dayCycle.hours);
  }
  if (!updateDayCycle._t || performance.now() - updateDayCycle._t > 250) {
    updateDayCycle._t = performance.now();
    const phaseEl = document.getElementById("dayPhase");
    if (phaseEl) phaseEl.textContent = lastDayStats.phase;
    const statsEl = document.getElementById("dayStats");
    if (statsEl) {
      const syncNote = dayCycle.syncRealtime ? " · live" : "";
      statsEl.textContent = `Sun ${elevDeg.toFixed(0)}° · Moon ${lastDayStats.moonElevDeg.toFixed(0)}° · ${dayCycle.lat.toFixed(2)}°, ${dayCycle.lon.toFixed(2)}°${syncNote}`;
    }
    const clockEl = document.getElementById("dayClock");
    if (clockEl) clockEl.textContent = formatClock(dayCycle.hours);
    const doy = document.getElementById("dayOfYear");
    if (doy && dayCycle.syncRealtime && document.activeElement !== doy) {
      doy.value = String(dayCycle.dayOfYear);
    }
  }
}

/** Procedural canvas textures (no external assets). */
function canvasTex(draw, size = 512) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const ctx = c.getContext("2d");
  draw(ctx, size);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy?.() || 4);
  return tex;
}

function makeCurtainFabricTex(baseHex = "#c4b59a", sheer = false) {
  return canvasTex((ctx, s) => {
    const r = parseInt(baseHex.slice(1, 3), 16) || 196;
    const g = parseInt(baseHex.slice(3, 5), 16) || 181;
    const b = parseInt(baseHex.slice(5, 7), 16) || 154;

      `rgba(${Math.max(0, Math.min(255, r + dr))},${Math.max(0, Math.min(255, g + dg))},${Math.max(0, Math.min(255, b + db))},${a})`;

      ctx.fillStyle = shade(18, 14, 8, sheer ? 0.12 : 0.18);
      ctx.fillRect(0, y, s, 1);

    for (let x = 0; x < s; x += sheer ? 4 : 3) {
      ctx.fillStyle = shade(-22, -18, -12, sheer ? 0.1 : 0.16);
      ctx.fillRect(x, 0, 1, s);
    }
    // Vertical pleat / drape bands
    const pleats = sheer ? 10 : 8;
    for (let i = 0; i < pleats; i++) {
      const x0 = (i / pleats) * s;
      const grad = ctx.createLinearGradient(x0, 0, x0 + s / pleats, 0);
      grad.addColorStop(0, shade(-40, -35, -28, 0.55));
      grad.addColorStop(0.35, shade(35, 30, 22, 0.35));
      grad.addColorStop(0.55, shade(10, 8, 5, 0.15));
      grad.addColorStop(1, shade(-45, -38, -30, 0.5));
      ctx.fillStyle = grad;
      ctx.fillRect(x0, 0, s / pleats + 1, s);
    }
    // Soft horizontal fall-off (heavier toward hem)
    const fall = ctx.createLinearGradient(0, 0, 0, s);
    fall.addColorStop(0, "rgba(255,255,255,0.08)");
    fall.addColorStop(0.55, "rgba(0,0,0,0)");
    fall.addColorStop(1, "rgba(0,0,0,0.18)");
    ctx.fillStyle = fall;
    ctx.fillRect(0, 0, s, s);
    if (!sheer) {
      // Subtle damask / floral noise blobs
      for (let i = 0; i < 12; i++) {
        const cx = Math.random() * s, cy = Math.random() * s;
        ctx.fillStyle = shade(25, 20, 12, 0.06);
        ctx.beginPath();
        ctx.ellipse(cx, cy, 18 + Math.random() * 30, 28 + Math.random() * 40, Math.random(), 0, Math.PI * 2);

}

/** Configure a light to cast room-blocking shadows (budgeted — too many kills WebGL). */

function resetShadowBudget() { _shadowCasterBudget = 0; }
function enableLightShadows(light, mapSize = 512, far = 14) {
  if (_shadowCasterBudget >= MAX_FIXTURE_SHADOWS) {
    light.castShadow = false;
    return false;
  }
  _shadowCasterBudget += 1;
  light.castShadow = true;
  light.shadow.mapSize.set(mapSize, mapSize);
  light.shadow.bias = -0.0008;
  light.shadow.normalBias = 0.04;
  light.shadow.radius = 1.25;
  if (light.shadow.camera) {
    light.shadow.camera.near = 0.1;
    light.shadow.camera.far = far;
    if (light.isSpotLight) {
      light.shadow.camera.fov = THREE.MathUtils.radToDeg(Math.min(light.angle * 2.05, Math.PI * 0.9));

    light.shadow.camera.updateProjectionMatrix?.();

  return true;
}

function fitSunShadowToScene() {
  if (!root.children.length) return;
  const box = new THREE.Box3().setFromObject(root);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const half = Math.max(size.x, size.z, 6) * 0.55 + 5;
  sun.shadow.camera.left = -half;
  sun.shadow.camera.right = half;
  sun.shadow.camera.top = half;
  sun.shadow.camera.bottom = -half;
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = Math.max(90, half * 5 + size.y);
  sun.shadow.camera.updateProjectionMatrix();
  sun.target.position.set(center.x, 0, center.z);
  sun.target.updateMatrixWorld();
}
