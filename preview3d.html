  if (Math.hypot(out[out.length - 1].x - end.x, out[out.length - 1].y - end.y) > 1) out.push(end);
  return out;
}
function wallSegs(wall, openings) {
  const opens = openings
    .filter((o) => o.wallId === wall.id)
    .map((o) => [Math.min(o.t0, o.t1), Math.max(o.t0, o.t1)])
    .sort((a, b) => a[0] - b[0]);
  const segs = [];
  let t = 0;
  for (const [a, b] of opens) {
    if (a > t + 1e-6) segs.push([t, a]);
    t = Math.max(t, b);
  }
  if (t < 1 - 1e-6) segs.push([t, 1]);
  return segs;
}
function unit(dx, dy) {
  const L = Math.hypot(dx, dy) || 1;
  return { x: dx / L, y: dy / L };
}
function perp(u) {
  return { x: -u.y, y: u.x };
}
function wallH(w) {
  return ((ceilingMm(doc, w)) * M);
}
function wallT(w) {
  return (w.thickness ?? doc?.wallThicknessMm ?? 120) * M;
}
function roomPoints(r) {
  if (Array.isArray(r.points) && r.points.length >= 3) return r.points;
  if (r.w != null) {
    return [
      { x: r.x, y: r.y },
      { x: r.x + r.w, y: r.y },
      { x: r.x + r.w, y: r.y + r.h },
      { x: r.x, y: r.y + r.h },
    ];
  }
  return [];
}

/** Intersect two infinite lines p+t*d and q+s*e */
function lineIntersect(p, d, q, e) {
  const cross = d.x * e.y - d.y * e.x;
  if (Math.abs(cross) < 1e-12) return null;
  const t = ((q.x - p.x) * e.y - (q.y - p.y) * e.x) / cross;
  return { x: p.x + t * d.x, y: p.y + t * d.y };
}

/**
 * Mitered wall footprint in plan mm, then extrude.
 * Near-miss endpoints are snapped; L-corners miter; T-junctions extend into the through-wall.
 * Polyline walls extrude as one continuous mesh (no crease at internal joints).
 */
let wallNet = []; // snapped walls used for 3D joins

function wallById(id) {
  if (!id) return null;
  return (wallNet || []).find((w) => w.id === id)
    || (doc?.walls || []).find((w) => w.id === id)
    || null;
}

function snapWallNetwork(walls) {
  const out = (walls || []).map((w) => {
    const pts = wallPoints(w).map((p) => ({ x: p.x, y: p.y }));
    if (pts.length < 2) {
      return { ...w, points: [{ x: 0, y: 0 }, { x: 1, y: 0 }], a: { x: 0, y: 0 }, b: { x: 1, y: 0 } };
    }
    return {
      ...w,
      points: pts,
      a: { ...pts[0] },
      b: { ...pts[pts.length - 1] },
    };
  });
  // Coalesce nearby vertices across objects (T-junctions / free ends)
  const verts = [];
  for (const w of out) {
    for (const p of w.points) verts.push(p);
  }
  for (let pass = 0; pass < 4; pass++) {
    for (let i = 0; i < verts.length; i++) {
      for (let j = i + 1; j < verts.length; j++) {
        const a = verts[i], b = verts[j];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d > 0.05 && d <= JOIN_TOL) {
          const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
          a.x = b.x = mx;
          a.y = b.y = my;
        }
      }
    }
  }
  for (const w of out) {
    w.a = { ...w.points[0] };
    w.b = { ...w.points[w.points.length - 1] };
  }
  return out;
}

function findConnectedDirs(point, selfWall) {
  const dirs = [];
  for (const w of wallNet) {
    if (w.id === selfWall.id) continue;
    const pts = wallPoints(w);
    for (let i = 0; i < pts.length; i++) {
      if (!near(pts[i], point, JOIN_TOL)) continue;
      if (i < pts.length - 1) dirs.push(unit(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y));
      if (i > 0) dirs.push(unit(pts[i - 1].x - pts[i].x, pts[i - 1].y - pts[i].y));
      if (w.closed && pts.length >= 3) {
        if (i === 0) dirs.push(unit(pts[pts.length - 1].x - pts[0].x, pts[pts.length - 1].y - pts[0].y));
        if (i === pts.length - 1) dirs.push(unit(pts[0].x - pts[i].x, pts[0].y - pts[i].y));
      }
    }
  }
  return dirs;
}

function projectOnSeg(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const L2 = dx * dx + dy * dy || 1;
  let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / L2;
  t = Math.max(0, Math.min(1, t));
  const q = { x: a.x + t * dx, y: a.y + t * dy };
  return { t, q, dist: Math.hypot(p.x - q.x, p.y - q.y) };
}

/** Abutting end hitting the side of another wall (not at its endpoints). */
function findTJunction(point, selfWall) {
  let best = null;
  for (const w of wallNet) {
    if (w.id === selfWall.id) continue;
    for (const e of wallEdges3d(w)) {
      if (near(point, e.a, JOIN_TOL) || near(point, e.b, JOIN_TOL)) continue;
      const pr = projectOnSeg(point, e.a, e.b);
      const half = (w.thickness ?? doc?.wallThicknessMm ?? 120) / 2;
      if (pr.dist <= half + JOIN_TOL && pr.t > 0.02 && pr.t < 0.98) {
        if (!best || pr.dist < best.dist) best = { wall: w, half, ...pr };
      }
    }
  }
  return best;
}

function miterOffsetCorner(P, wallDir, halfMm, side, otherDirs) {
  // wallDir: unit along wall (p0 -> p1). side +1 = left (perp), -1 = right
  const n = perp(wallDir);
  const base = { x: P.x + n.x * halfMm * side, y: P.y + n.y * halfMm * side };
  if (!otherDirs.length) return base;

  let best = null;
  let bestScore = -1;
  for (const od of otherDirs) {
    const on = perp(od);
    // Match continuous outer/inner face: pick offset side whose normal agrees with ours
    let s = side;
    if (on.x * n.x + on.y * n.y < 0) s = -side;
    const oBase = { x: P.x + on.x * halfMm * s, y: P.y + on.y * halfMm * s };
    const hit = lineIntersect(base, wallDir, oBase, od);
    if (!hit) continue;
    // Prefer miters close to the corner; reject if far behind along wall
    const along = (hit.x - P.x) * wallDir.x + (hit.y - P.y) * wallDir.y;
    if (along < -halfMm * 6 || along > halfMm * 6) continue;
    const score = 1 / (1 + Math.hypot(hit.x - P.x, hit.y - P.y));
    if (score > bestScore) {
      bestScore = score;
      best = hit;
    }
  }
  if (!best) return base;
  const maxMiter = halfMm * 5;
  if (Math.hypot(best.x - P.x, best.y - P.y) > maxMiter) return base;
  return best;
}

/** Offset a centerline polyline to left/right with miters at internal joints. */
function offsetChainSides(pts, halfMm, wall, isStartOfWall, isEndOfWall) {
  const n = pts.length;
  if (n < 2) return { left: [], right: [] };
  const left = [];
  const right = [];
  for (let i = 0; i < n; i++) {
    let dirIn, dirOut;
    if (i === 0) {
      dirOut = unit(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
      dirIn = dirOut;
    } else if (i === n - 1) {
      dirIn = unit(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      dirOut = dirIn;
    } else {
      dirIn = unit(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      dirOut = unit(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
    }
    // Internal joints: miter using both adjacent edge dirs (same object — seamless)
    let otherDirs = [];
    if (i === 0 && isStartOfWall) otherDirs = findConnectedDirs(pts[0], wall);
    else if (i === n - 1 && isEndOfWall) otherDirs = findConnectedDirs(pts[i], wall);
    else if (i > 0 && i < n - 1) {
      // Self-miter: treat previous edge dir as "other"
      otherDirs = [dirIn];
    }
    const along = (i === 0) ? dirOut : (i === n - 1) ? dirIn : unit(dirIn.x + dirOut.x, dirIn.y + dirOut.y);
    left.push(miterOffsetCorner(pts[i], along, halfMm, +1, otherDirs.length ? otherDirs : (i > 0 && i < n - 1 ? [dirOut] : [])));
    right.push(miterOffsetCorner(pts[i], along, halfMm, -1, otherDirs.length ? otherDirs : (i > 0 && i < n - 1 ? [dirOut] : [])));
  }
  // Better internal miter: intersect offset lines of consecutive edges
  for (let i = 1; i < n - 1; i++) {
    const d0 = unit(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    const d1 = unit(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
    const n0 = perp(d0), n1 = perp(d1);
    for (const side of [+1, -1]) {
      const p0 = { x: pts[i].x + n0.x * halfMm * side, y: pts[i].y + n0.y * halfMm * side };
      const p1 = { x: pts[i].x + n1.x * halfMm * side, y: pts[i].y + n1.y * halfMm * side };
      const hit = lineIntersect(p0, d0, p1, d1);
      if (!hit) continue;
      if (Math.hypot(hit.x - pts[i].x, hit.y - pts[i].y) > halfMm * 5) continue;
      if (side > 0) left[i] = hit;
      else right[i] = hit;
    }
  }
  return { left, right };
}

function addWallSolidChain(centerPts, wall, isStartOfWall, isEndOfWall, y0 = 0, heightOverride = null) {
  if (!centerPts || centerPts.length < 2) return;
  const halfMm = (wall.thickness ?? doc?.wallThicknessMm ?? 120) / 2;
  const height = heightOverride != null ? heightOverride : wallH(wall);

  let pts = centerPts.map((p) => ({ ...p }));
  // T-junction extension only at true free ends of the wall object
  if (isStartOfWall) {
    const dirsA = findConnectedDirs(pts[0], wall);
    const tJ = !dirsA.length ? findTJunction(pts[0], wall) : null;
    if (tJ) {
      const u = unit(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
      const ext = tJ.half + 2;
      pts[0] = { x: pts[0].x - u.x * ext, y: pts[0].y - u.y * ext };
    }
  }
  if (isEndOfWall) {
    const last = pts.length - 1;
    const dirsB = findConnectedDirs(pts[last], wall);
    const tJ = !dirsB.length ? findTJunction(pts[last], wall) : null;
    if (tJ) {
      const u = unit(pts[last].x - pts[last - 1].x, pts[last].y - pts[last - 1].y);
      const ext = tJ.half + 2;
      pts[last] = { x: pts[last].x + u.x * ext, y: pts[last].y + u.y * ext };
    }
  }

  const { left, right } = offsetChainSides(pts, halfMm, wall, isStartOfWall, isEndOfWall);
  if (left.length < 2) return;

  const shape = new THREE.Shape();
  const [x0, y0s] = shapeXY(left[0].x, left[0].y);
  shape.moveTo(x0, y0s);
  for (let i = 1; i < left.length; i++) {
    const [x, y] = shapeXY(left[i].x, left[i].y);
    shape.lineTo(x, y);
  }
  for (let i = right.length - 1; i >= 0; i--) {
    const [x, y] = shapeXY(right[i].x, right[i].y);
    shape.lineTo(x, y);
  }
  shape.closePath();

  const multi = pts.length > 2;
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: height,
    bevelEnabled: !multi,
    bevelThickness: multi ? 0 : 0.008,
    bevelSize: multi ? 0 : 0.005,
    bevelOffset: multi ? 0 : -0.002,
    bevelSegments: multi ? 0 : 2,
    curveSegments: 1,
  });
  geo.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(geo, wallMat);
  mesh.position.y = y0;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  root.add(mesh);
}

/** Legacy straight segment helper — routes through chain extrude. */
function addWallSolid(p0, p1, wall, isStartOfWall, isEndOfWall, y0 = 0, heightOverride = null) {
  addWallSolidChain([p0, p1], wall, isStartOfWall, isEndOfWall, y0, heightOverride);
}

/** Small corner plug only where 2+ walls meet — fills residual miter gaps (not free ends). */
/** Small corner plug only where different wall objects meet (not internal polyline joints). */
function addJunctionFills() {
  const nodes = new Map();
  const keyOf = (p) => `${Math.round(p.x / 5)}_${Math.round(p.y / 5)}`;
  for (const w of wallNet) {
    const th = w.thickness ?? doc?.wallThicknessMm ?? 120;
    const h = wallH(w);
    const elev = (w.elevMm || 0) * M;
    const pts = wallPoints(w);
    if (pts.length < 2) continue;
    // Free ends only (closed walls have no free ends for plugs between own joints)
    const ends = w.closed ? [] : [pts[0], pts[pts.length - 1]];
    for (const p of ends) {
      const k = keyOf(p);
      const prev = nodes.get(k);
      if (!prev) nodes.set(k, { p: { ...p }, n: 1, th, h, elev });
      else {
        prev.n += 1;
        prev.th = Math.max(prev.th, th);
        prev.h = Math.max(prev.h, h);
        prev.elev = Math.min(prev.elev, elev);
      }
    }
  }
  for (const node of nodes.values()) {
    if (node.n < 2) continue;
    const t = node.th * M * 1.05;
    const mesh = new THREE.Mesh(boxGeo(t, node.h, t, Math.min(0.02, t * 0.2)), wallMat);
    mesh.position.set(px(node.p.x), node.elev + node.h / 2, pz(node.p.y));
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    root.add(mesh);
  }
}

function signedArea(pts) {
  let a = 0;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length];
    a += p.x * q.y - q.x * p.y;
  }
  return a / 2;
}

/** Expand polygon outward by `dist` mm (joins floors under wall thickness). */
function offsetPolygon(pts, dist) {
  if (pts.length < 3 || !dist) return pts.map((p) => ({ x: p.x, y: p.y }));
  // CCW → interior is left of edges; CW → interior is right. Outward = opposite.
  const ccw = signedArea(pts) > 0;
  const n = pts.length;
  const out = [];
  for (let i = 0; i < n; i++) {
    const prev = pts[(i - 1 + n) % n];
    const cur = pts[i];
    const next = pts[(i + 1) % n];
    const e1 = unit(cur.x - prev.x, cur.y - prev.y);
    const e2 = unit(next.x - cur.x, next.y - cur.y);
    // Outward normals: right of edge if CCW, left if CW
    const s = ccw ? 1 : -1;
    const n1 = { x: e1.y * s, y: -e1.x * s };
    const n2 = { x: e2.y * s, y: -e2.x * s };
    let mx = n1.x + n2.x, my = n1.y + n2.y;
    const ml = Math.hypot(mx, my);
    if (ml < 1e-8) {
      out.push({ x: cur.x + n1.x * dist, y: cur.y + n1.y * dist });
      continue;
    }
    mx /= ml;
    my /= ml;
    // miter length capped
    const cos = Math.max(-0.999, Math.min(0.999, n1.x * n2.x + n1.y * n2.y));
    const miter = Math.min(4, 1 / Math.sqrt(Math.max(0.05, (1 + cos) / 2)));
    out.push({ x: cur.x + mx * dist * miter, y: cur.y + my * dist * miter });
  }
  return out;
}

function addPolygonFloor(pts, mat = floorMat, y = 0.015) {
  if (pts.length < 3) return;
  const shape = new THREE.Shape();
  const [x0, y0] = shapeXY(pts[0].x, pts[0].y);
  shape.moveTo(x0, y0);
  for (let i = 1; i < pts.length; i++) {
    const [x, y] = shapeXY(pts[i].x, pts[i].y);
    shape.lineTo(x, y);
  }
  shape.closePath();
  const geo = new THREE.ShapeGeometry(shape);
  geo.rotateX(-Math.PI / 2);
  // UV from world XZ for texture repeat
  const pos = geo.attributes.position;
  const uvs = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    uvs.setXY(i, pos.getX(i) * 0.35, pos.getZ(i) * 0.35);
  }
  uvs.needsUpdate = true;
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = y;
  mesh.receiveShadow = true;
  root.add(mesh);
  return mesh;
}

/** Floor under a wall footprint so rooms join continuously. */
function addWallFloorStrip(wall, halfExtraMm = 0) {
  const half = ((wall.thickness ?? doc?.wallThicknessMm ?? 120) / 2) + halfExtraMm;
  for (const e of wallEdges3d(wall)) {
    const along = unit(e.b.x - e.a.x, e.b.y - e.a.y);
    const n = { x: -along.y, y: along.x };
    const a = e.a, b = e.b;
    const pts = [
      { x: a.x + n.x * half, y: a.y + n.y * half },
      { x: b.x + n.x * half, y: b.y + n.y * half },
      { x: b.x - n.x * half, y: b.y - n.y * half },
      { x: a.x - n.x * half, y: a.y - n.y * half },
    ];
    addPolygonFloor(pts, floorMat, 0.012);
  }
}

function buildJoinedFloors() {
  applyFlooringStyle(doc.flooring || "hardwood");
  const walls = wallNet.length ? wallNet : (doc.walls || []);
  let maxTh = Number(doc.wallThicknessMm) || 120;
  for (const w of walls) {
    const t = Number(w.thickness);
    if (Number.isFinite(t) && t > maxTh) maxTh = t;
  }
  // Reach past inner faces into/through the wall mass so floors meet under walls
  const half = maxTh / 2 + 8;
  const rooms = doc.rooms || [];
  if (rooms.length) {
    for (const r of rooms) {
      const pts = roomPoints(r);
      if (pts.length < 3) continue;
      addPolygonFloor(offsetPolygon(pts, half), floorMat, 0.014);
    }
  } else {
    // No rooms: slab from wall AABB
    if (!walls.length) return;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const w of walls) {
      for (const p of wallPoints(w)) {
        minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
        maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
      }
    }
    const pad = half + 200;
    addPolygonFloor([
      { x: minX - pad, y: minY - pad },
      { x: maxX + pad, y: minY - pad },
      { x: maxX + pad, y: maxY + pad },
      { x: minX - pad, y: maxY + pad },
    ], floorMat, 0.014);
  }
  for (const w of walls) {
    addWallFloorStrip(w, 8);
  }
}

/** Invisible solid ceiling — blocks light from above, does not cover the camera view. */
function buildSolidCeilings() {
  if (!doc) return;
  const H = ceilingMm(doc) * M;
  const walls = wallNet.length ? wallNet : (doc.walls || []);
  let maxTh = Number(doc.wallThicknessMm) || 120;
  for (const w of walls) {
    const t = Number(w.thickness);
    if (Number.isFinite(t) && t > maxTh) maxTh = t;
  }
  const half = maxTh / 2 + 8;
  const rooms = doc.rooms || [];
  const place = (pts) => {
    if (!pts || pts.length < 3) return;
    const mesh = addPolygonFloor(pts, ceilingMat, H - 0.015);
    if (!mesh) return;
    mesh.castShadow = true;
    mesh.receiveShadow = false;
    mesh.renderOrder = -1;
    mesh.userData = { kind: "ceiling", invisible: true };
  };
  if (rooms.length) {
    for (const r of rooms) {
      const pts = roomPoints(r);
      if (pts.length < 3) continue;
      place(offsetPolygon(pts, half));
    }
  } else {
    if (!walls.length) return;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const w of walls) {
      for (const p of wallPoints(w)) {
        minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
        maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
      }
    }
    const pad = half + 200;
    place([
      { x: minX - pad, y: minY - pad },
      { x: maxX + pad, y: minY - pad },
      { x: maxX + pad, y: maxY + pad },
      { x: minX - pad, y: maxY + pad },
    ]);
  }
}

/** Build wall with openings that have sill + height (not only full-height cuts). */
function buildWallBands(wall) {
  const elev = wall.elevMm || 0;
  const Hmm = ceilingMm(doc, wall);
  const opens = (doc.openings || [])
    .filter((o) => o.wallId === wall.id)
    .map((o) => ({
      t0: Math.min(o.t0, o.t1),
      t1: Math.max(o.t0, o.t1),
      sill: o.sillMm ?? 0,
      head: Math.min(Hmm, (o.sillMm ?? 0) + (o.heightMm ?? Hmm)),
    }));
  const ys = new Set([0, Hmm]);
  for (const o of opens) { ys.add(o.sill); ys.add(o.head); }
  const levels = [...ys].sort((a, b) => a - b);
  for (let i = 0; i < levels.length - 1; i++) {
    const y0 = levels[i], y1 = levels[i + 1];
    if (y1 - y0 < 5) continue;
    const gaps = opens
      .filter((o) => o.sill <= y0 + 0.5 && o.head >= y1 - 0.5)
      .map((o) => [o.t0, o.t1])
      .sort((a, b) => a[0] - b[0]);
    const segs = [];
    let t = 0;
    for (const [a, b] of gaps) {
      if (a > t + 1e-6) segs.push([t, a]);
      t = Math.max(t, b);
    }
    if (t < 1 - 1e-6) segs.push([t, 1]);
    for (const [t0, t1] of segs) {
      const span = wallSpanPoints(wall, t0, t1);
      addWallSolidChain(
        span,
        wall,
        Math.abs(t0) < 1e-6,
        Math.abs(t1 - 1) < 1e-6,
        (elev + y0) * M,
        (y1 - y0) * M
      );
    }
  }
}

function syncOpeningsFromFixtures() {
  for (const d of doc.doors || []) {
    const o = d.openingId ? (doc.openings || []).find((x) => x.id === d.openingId) : null;
    if (!o) continue;
    if (d.heightMm != null) o.heightMm = d.heightMm;
    o.sillMm = d.sillMm ?? 0;
    o.type = "door";
    // Keep opening span matched to door leaf width so frame sits in the wall slit
    const wall = wallById(o.wallId) || (doc.walls || []).find((w) => w.id === o.wallId);
    if (wall && (d.widthMm || d.len)) {
      const L = wallLenMm(wall);
      const mid = (Math.min(o.t0, o.t1) + Math.max(o.t0, o.t1)) / 2;
      const half = (Math.max(200, d.widthMm || d.len) / 2) / L;
      o.t0 = Math.max(0, mid - half);
      o.t1 = Math.min(1, mid + half);
    }
  }
  for (const w of doc.windows || []) {
    const o = w.openingId ? (doc.openings || []).find((x) => x.id === w.openingId) : null;
    if (!o) continue;
    if (w.heightMm != null) o.heightMm = w.heightMm;
    if (w.sillMm != null) o.sillMm = w.sillMm;
    o.type = "window";
    const wall = wallById(o.wallId) || (doc.walls || []).find((x) => x.id === o.wallId);
    if (wall && w.widthMm) {
      const L = wallLenMm(wall);
      const mid = (Math.min(o.t0, o.t1) + Math.max(o.t0, o.t1)) / 2;
      const half = (Math.max(200, w.widthMm) / 2) / L;
      o.t0 = Math.max(0, mid - half);
      o.t1 = Math.min(1, mid + half);
    }
  }
}

function addDoorMesh(d) {
  const style = d.style || "swing";
  const openSide = d.openSide != null ? (d.openSide >= 0 ? 1 : -1) : ((d.openDelta ?? 85) >= 0 ? 1 : -1);
  const openAngle = Math.abs(d.openAngle ?? d.openDelta ?? 85) || 85;

  const o = d.openingId ? (doc.openings || []).find((x) => x.id === d.openingId) : null;
  const wall = o ? wallById(o.wallId) : null;

  let width = (d.widthMm || d.len || 900) * M;
  let height = (d.heightMm || 2100) * M;
  let sill = (d.sillMm || 0) * M;
  let hinge = d.hinge || { x: 0, y: 0 };
  let leafDir = { x: 1, y: 0 };
  let wallN = { x: 0, y: 1 };
  let swingSign = openSide;
  let halfTh = ((doc.wallThicknessMm ?? 120) / 2) * M;
  let p0 = null, p1 = null;
  let baseElev = 0;

  if (o && wall) {
    const t0 = Math.min(o.t0, o.t1), t1 = Math.max(o.t0, o.t1);
    p0 = pointAt(wall, t0);
    p1 = pointAt(wall, t1);
    width = Math.hypot(p1.x - p0.x, p1.y - p0.y) * M;
    height = (o.heightMm ?? d.heightMm ?? 2100) * M;
    baseElev = (wall.elevMm || 0) * M;
    sill = baseElev + (o.sillMm ?? d.sillMm ?? 0) * M;
    const along = unit(p1.x - p0.x, p1.y - p0.y);
    wallN = { x: -along.y, y: along.x };
    const hingeAtEnd = d.hingeAt === "end";
    hinge = hingeAtEnd ? p1 : p0;
    leafDir = hingeAtEnd ? { x: -along.x, y: -along.y } : along;
    const targetN = { x: wallN.x * openSide, y: wallN.y * openSide };
    const cross = leafDir.x * targetN.y - leafDir.y * targetN.x;
    swingSign = cross >= 0 ? 1 : -1;
    halfTh = ((wall.thickness ?? doc.wallThicknessMm ?? 120) / 2) * M;
  } else {
    const ang = ((d.closedDeg || 0) * Math.PI) / 180;
    leafDir = { x: Math.cos(ang), y: Math.sin(ang) };
    wallN = { x: -leafDir.y, y: leafDir.x };
  }

  const wallTh = halfTh * 2;
  // Frame fills the opening; leaf fills clear opening (tiny clearance only)
  const jamb = Math.min(0.05, width * 0.06);
  const head = Math.min(0.045, height * 0.04);
  const gap = 0.003;
  const clearW = Math.max(0.2, width - jamb * 2);
  const clearH = Math.max(0.4, height - head - gap);
  const leafT = Math.min(0.04, wallTh * 0.35);

  const mid = p0 && p1
    ? { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 }
    : hinge;
  const group = new THREE.Group();
  group.position.set(px(mid.x), 0, pz(mid.y));
  const wallYaw = -Math.atan2(leafDir.y, leafDir.x);
  group.rotation.y = wallYaw;

  // Jambs + head — edge-to-edge with wall opening, full wall thickness (cast shadows)
  const frameZ = 0;
  const leftJ = new THREE.Mesh(boxGeo(jamb, height, wallTh, 0.008), doorFrameMat);
  leftJ.position.set(-width / 2 + jamb / 2, sill + height / 2, frameZ);
  const rightJ = new THREE.Mesh(boxGeo(jamb, height, wallTh, 0.008), doorFrameMat);
  rightJ.position.set(width / 2 - jamb / 2, sill + height / 2, frameZ);
  const headJ = new THREE.Mesh(boxGeo(Math.max(0.05, width - jamb * 2), head, wallTh, 0.008), doorFrameMat);
  headJ.position.set(0, sill + height - head / 2, frameZ);
  for (const part of [leftJ, rightJ, headJ]) {
    part.castShadow = true;
    part.receiveShadow = true;
  }
  group.add(leftJ, rightJ, headJ);

  // Closed-door shadow plug — blocks light through the clear opening when shut
  const occluder = new THREE.Mesh(
    boxGeo(Math.max(0.15, clearW - gap * 2), clearH, Math.max(0.04, wallTh * 0.85)),
    shadowOnlyMat,
  );
  occluder.position.set(0, sill + clearH / 2, 0);
  occluder.castShadow = true;
  occluder.receiveShadow = false;
  group.add(occluder);

  // Leaf sits just toward open-side of wall centerline
  const zBias = -openSide * (leafT / 2 + 0.004);

  const makeLeaf = (w, h) => {
    const leaf = new THREE.Mesh(boxGeo(w, h, leafT, Math.min(0.014, leafT * 0.45)), doorMat.clone());
    leaf.userData = { kind: "door", id: d.id };
    leaf.castShadow = true;
    leaf.receiveShadow = true;
    return leaf;
  };

  // Pivot at hinge jamb inner face
  const hingeAtEnd = d.hingeAt === "end";
  const hingeLocalX = hingeAtEnd ? width / 2 - jamb : -width / 2 + jamb;
  const pivot = new THREE.Group();
  pivot.position.set(hingeLocalX, 0, zBias);
  group.add(pivot);

  const leafSign = hingeAtEnd ? -1 : 1; // leaf extends toward opening center
  const closedOffset = ((d.closedOffsetDeg || 0) * Math.PI) / 180;
  // Plan swingSign maps to local yaw (local +Y up, +X along wall after group yaw)
  const baseYaw = -leafSign * closedOffset;

  if (style === "double") {
    const half = clearW / 2;
    const leafL = makeLeaf(half - gap, clearH);
    leafL.position.set(half / 2, sill + clearH / 2, 0);
    const rightPivot = new THREE.Group();
    rightPivot.position.set(clearW, 0, 0);
    const leafR = makeLeaf(half - gap, clearH);
    leafR.position.set(-half / 2, sill + clearH / 2, 0);
    rightPivot.add(leafR);
    // Re-anchor pivot at left clear edge
    pivot.position.set(-width / 2 + jamb, 0, zBias);
    pivot.add(leafL, rightPivot);
    doorMeshes[d.id] = {
      pivot, def: d, leaf: leafL, leafR, rightPivot,
      base: baseYaw, style, openSide, swingSign, openAngle, leafSign: 1,
      occluder,
    };
    clickables.push(leafL, leafR);
  } else if (style === "sliding" || style === "pocket") {
    const leaf = makeLeaf(clearW * 0.55, clearH);
    leaf.position.set(clearW * 0.28, sill + clearH / 2, 0);
    pivot.position.set(-width / 2 + jamb, 0, zBias);
    pivot.add(leaf);
    doorMeshes[d.id] = {
      pivot, def: d, leaf, base: baseYaw, style, width: clearW, openSide, swingSign, openAngle,
      slideClosed: clearW * 0.28, slideOpen: clearW * 0.72,
      occluder,
    };
    clickables.push(leaf);
  } else if (style === "bifold") {
    const half = clearW / 2;
    const leaf1 = makeLeaf(half - gap, clearH);
    leaf1.position.set(half / 2, sill + clearH / 2, 0);
    const fold = new THREE.Group();
    fold.position.set(half, 0, 0);
    const leaf2 = makeLeaf(half - gap, clearH);
    leaf2.position.set(half / 2, sill + clearH / 2, 0);
    fold.add(leaf2);
    pivot.add(leaf1, fold);
    doorMeshes[d.id] = {
      pivot, def: d, leaf: leaf1, leaf2, fold, base: baseYaw, style, openSide, swingSign, openAngle,
      occluder,
    };
    clickables.push(leaf1, leaf2);
  } else {
    const leaf = makeLeaf(clearW - gap, clearH);
    leaf.position.set(leafSign * (clearW / 2), sill + clearH / 2, 0);
    pivot.add(leaf);
    doorMeshes[d.id] = {
      pivot, def: d, leaf, base: baseYaw, style, openSide, swingSign, openAngle, leafSign,
      occluder,
    };
    clickables.push(leaf);
  }

  root.add(group);
}

function addWindowMesh(win) {
  const o = (doc.openings || []).find((x) => x.id === win.openingId);
  const wall = wallById(o?.wallId || win.wallId);
  if (!wall || !o) return;
  const t0 = Math.min(o.t0, o.t1), t1 = Math.max(o.t0, o.t1);
  const p0 = pointAt(wall, t0);
  const p1 = pointAt(wall, t1);
  const mid = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
  const ang = Math.atan2(p1.y - p0.y, p1.x - p0.x);
  const width = Math.hypot(p1.x - p0.x, p1.y - p0.y) * M;
  const height = (o.heightMm ?? win.heightMm ?? 1200) * M;
  const baseElev = (wall.elevMm || 0) * M;
  const sill = baseElev + (o.sillMm ?? win.sillMm ?? 900) * M;
  const wallTh = (wall.thickness || 120) * M;
  const style = win.style || "sliding";

  const group = new THREE.Group();
  group.position.set(px(mid.x), 0, pz(mid.y));
  group.rotation.y = -ang;

  const frameW = 0.045;
  const alu = aluMat;
  const aluDark = aluDarkMat;
  const mkFramePart = (bw, bh, bd, x, y, z, mat = alu) => {
    const m = new THREE.Mesh(boxGeo(bw, bh, bd, Math.min(0.006, Math.min(bw, bh, bd) * 0.2)), mat);
    m.position.set(x, y, z);
    m.castShadow = true;
    m.receiveShadow = true;
    group.add(m);
    return m;
  };
  const cy = sill + height / 2;
  // Outer aluminum casing (fills wall opening)
  mkFramePart(width, frameW, wallTh, 0, sill + frameW / 2, 0, aluDark); // sill
  mkFramePart(width, frameW, wallTh, 0, sill + height - frameW / 2, 0, aluDark); // head
  mkFramePart(frameW, height, wallTh, -width / 2 + frameW / 2, cy, 0, aluDark);
  mkFramePart(frameW, height, wallTh, width / 2 - frameW / 2, cy, 0, aluDark);

  const clearW = Math.max(0.12, width - frameW * 2);
  const clearH = Math.max(0.12, height - frameW * 2);
  const glassT = 0.008;

  const makeSash = (sw, sh) => {
    const sash = new THREE.Group();
    const rail = 0.032;
    const depth = Math.max(glassT + 0.018, wallTh * 0.22);
    const addRail = (bw, bh, bd, x, y, z) => {
      const m = new THREE.Mesh(boxGeo(bw, bh, bd), alu.clone());
      m.position.set(x, y, z);
      m.castShadow = true;
      sash.add(m);
      return m;
    };
    // Aluminum sash rails (hollow frame, not a solid back plate)
    addRail(sw, rail, depth, 0, -sh / 2 + rail / 2, 0); // bottom
    addRail(sw, rail, depth, 0, sh / 2 - rail / 2, 0); // top
    addRail(rail, Math.max(0.04, sh - rail * 2), depth, -sw / 2 + rail / 2, 0, 0);
    addRail(rail, Math.max(0.04, sh - rail * 2), depth, sw / 2 - rail / 2, 0, 0);
    // Mid mullion on wider sashes
    if (sw > 0.55) {
      addRail(rail * 0.7, Math.max(0.04, sh - rail * 2), depth * 0.9, 0, 0, 0);
    }
    // Glass panes (one or two lights)
    const paneW = sw > 0.55
      ? Math.max(0.04, (sw - rail * 3) / 2)
      : Math.max(0.05, sw - rail * 2);
    const paneH = Math.max(0.05, sh - rail * 2);
    const paneMat = glassMat.clone();
    paneMat.userData = { isWindowGlass: true };
    const addPane = (x) => {
      const glass = new THREE.Mesh(boxGeo(paneW, paneH, glassT), paneMat);
      glass.position.set(x, 0, 0);
      // Glass does NOT cast shadows — daylight / fixtures pass through
      glass.castShadow = false;
      glass.receiveShadow = false;
      glass.userData = { kind: "window", id: win.id, isWindowGlass: true };
      sash.add(glass);
      clickables.push(glass);
      return glass;
    };
    if (sw > 0.55) {
      addPane(-paneW / 2 - rail * 0.35);
      addPane(paneW / 2 + rail * 0.35);
    } else {
      addPane(0);
    }
    return sash;
  };

  const entry = {
    group, style, width: clearW, height: clearH, sill,
    amount: win.open ? 1 : 0, pivots: [], sashes: [],
  };

  const sashY = sill + height / 2;

  if (style === "fixed") {
    const sash = makeSash(clearW, clearH);
    sash.position.set(0, sashY, 0);
    group.add(sash);
    entry.sashes.push(sash);
  } else if (style === "casement") {
    const pivot = new THREE.Group();
    pivot.position.set(-clearW / 2, sashY, -wallTh * 0.15);
    const sash = makeSash(clearW, clearH);
    sash.position.set(clearW / 2, 0, 0);
    pivot.add(sash);
    group.add(pivot);
    entry.pivots.push(pivot);
    entry.sashes.push(sash);
    entry.maxAngle = 1.2;
  } else if (style === "awning") {
    const pivot = new THREE.Group();
    pivot.position.set(0, sill + height - frameW, -wallTh * 0.15);
    const sash = makeSash(clearW, clearH);
    sash.position.set(0, -clearH / 2, 0);
    pivot.add(sash);
    group.add(pivot);
    entry.pivots.push(pivot);
    entry.sashes.push(sash);
    entry.maxAngle = 0.75;
  } else if (style === "double") {
    const halfH = clearH * 0.5 - 0.004;
    const upper = makeSash(clearW, halfH);
    upper.position.set(0, sashY + clearH * 0.25, wallTh * 0.08);
    const lower = makeSash(clearW, halfH);
    lower.position.set(0, sashY - clearH * 0.25, -wallTh * 0.08);
    group.add(upper, lower);
    entry.sashes.push(upper, lower);
    entry.lower = lower;
    entry.lowerClosedY = sashY - clearH * 0.25;
    entry.lowerOpenY = sashY + clearH * 0.12;
  } else {
    // Sliding: two overlapping aluminum sashes on tracks
    const sashW = clearW * 0.52;
    const rear = makeSash(sashW, clearH);
    rear.position.set(-clearW * 0.24, sashY, wallTh * 0.1);
    const front = makeSash(sashW, clearH);
    front.position.set(clearW * 0.24, sashY, -wallTh * 0.1);
    group.add(rear, front);
    entry.sashes.push(rear, front);
    entry.moving = front;
    entry.slideClosedX = clearW * 0.24;
    entry.slideOpenX = -clearW * 0.24;
    // Aluminum track rails
    mkFramePart(clearW, 0.01, wallTh * 0.4, 0, sill + frameW + 0.006, 0, aluDark);
    mkFramePart(clearW, 0.01, wallTh * 0.4, 0, sill + height - frameW - 0.006, 0, aluDark);
  }

  root.add(group);
  windowMeshes[win.id] = entry;
  if (windowAnim[win.id] == null) windowAnim[win.id] = win.open ? 1 : 0;
}

function applyWindowPose(m, t) {
  const style = m.style;
  if (style === "casement" && m.pivots[0]) {
    m.pivots[0].rotation.y = -m.maxAngle * t;
  } else if (style === "awning" && m.pivots[0]) {
    m.pivots[0].rotation.x = m.maxAngle * t;
  } else if (style === "double" && m.lower) {
    m.lower.position.y = m.lowerClosedY + (m.lowerOpenY - m.lowerClosedY) * t;
  } else if ((style === "sliding" || !style || style === "pocket") && m.moving) {
    m.moving.position.x = m.slideClosedX + (m.slideOpenX - m.slideClosedX) * t;
  }
  // Slight tint shift when open (keep transmission glass intact)
  for (const sash of m.sashes) {
    sash.traverse((ch) => {
      if (!ch.material || !ch.userData?.isWindowGlass) return;
      const mat = ch.material;
      if (mat.transmission != null && mat.transmission > 0.2) {
        mat.color.setRGB(0.85 - t * 0.05, 0.93 - t * 0.02, 0.97);
      } else if (mat.transparent && mat.opacity != null) {
        mat.opacity = 0.28 + t * 0.08;
      }
    });
  }
}

function rebuild(shouldFit = false) {
  while (root.children.length) root.remove(root.children[0]);
  clickables.length = 0;
  Object.keys(movableRoots).forEach((k) => delete movableRoots[k]);
  Object.keys(doorMeshes).forEach((k) => delete doorMeshes[k]);
  Object.keys(lightMeshes).forEach((k) => delete lightMeshes[k]);
  Object.keys(fanMeshes).forEach((k) => delete fanMeshes[k]);
  Object.keys(windowMeshes).forEach((k) => delete windowMeshes[k]);
  Object.keys(curtainMeshes).forEach((k) => delete curtainMeshes[k]);
  if (!doc) return;

  wallNet = snapWallNetwork(doc.walls || []);
  syncOpeningsFromFixtures();
  buildJoinedFloors();
  for (const w of wallNet) buildWallBands(w);
  addJunctionFills();
  buildSolidCeilings();

  const defaultH = ceilingMm(doc) * M;
  for (const d of doc.doors || []) addDoorMesh(d);
  for (const win of doc.windows || []) addWindowMesh(win);

  resetShadowBudget();
  for (const l of doc.lights || []) {
    const group = new THREE.Group();
    const mountFrac = l.mountFrac != null ? Number(l.mountFrac) : (1 - HEIGHT_PRESETS.lightBelowCeiling);
    group.position.set(px(l.x), defaultH * mountFrac + (l.elevMm || 0) * M, pz(l.y));
    const k = l.colorTempK || 3000;
    const col = kelvinToRgb(k);
    const shape = l.shape || "bulb";
    const rotY = -((l.rotationDeg || 0) * Math.PI) / 180;
    const mat = new THREE.MeshStandardMaterial({
      color: col.clone(),
      emissive: new THREE.Color(0x000000),
      roughness: 0.35,
      metalness: 0.05,
    });
    let mesh;
    let lamp = null;
    const power = Math.max(0, Number(l.intensity) ?? 1);

    if (shape === "tube") {
      const len = Math.max(0.3, (l.lengthMm || 1200) * M);
      mesh = new THREE.Mesh(boxGeo(len, 0.035, 0.055, 0.008), mat);
      mesh.rotation.y = rotY;
      const area = new THREE.RectAreaLight(col.getHex(), 0, len * 0.95, 0.04);
      area.rotation.x = -Math.PI / 2;
      area.position.y = -0.03;
      area.rotation.z = rotY;
      // Soft area look; optional budgeted spot for wall occlusion
      const spot = new THREE.SpotLight(col.getHex(), 0, 11, Math.PI / 2.4, 0.55, 1.5);
      spot.position.set(0, -0.05, 0);
      spot.target.position.set(0, -4, 0);
      const shadowed = l.on && enableLightShadows(spot, 512, 12);
      group.add(area, spot, spot.target);
      lamp = { type: "area", light: area, shadow: shadowed ? spot : null, gain: 3.5, shadowGain: 14 };
    } else if (shape === "panel") {
      const w = Math.max(0.25, (l.lengthMm || 600) * M * 0.5);
      mesh = new THREE.Mesh(boxGeo(w, 0.028, w, 0.006), mat);
      mesh.rotation.y = rotY;
      const area = new THREE.RectAreaLight(col.getHex(), 0, w * 0.92, w * 0.92);
      area.rotation.x = -Math.PI / 2;
      area.position.y = -0.025;
      const spot = new THREE.SpotLight(col.getHex(), 0, 12, Math.PI / 2.1, 0.5, 1.4);
      spot.position.set(0, -0.04, 0);
      spot.target.position.set(0, -4, 0);
      const shadowed = l.on && enableLightShadows(spot, 512, 12);
      group.add(area, spot, spot.target);
      lamp = { type: "area", light: area, shadow: shadowed ? spot : null, gain: 4.5, shadowGain: 16 };
    } else if (shape === "spot") {
      mesh = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.12, 20), mat);
      mesh.rotation.x = Math.PI;
      mesh.position.y = -0.02;
      mesh.rotation.y = rotY;
      const spot = new THREE.SpotLight(col.getHex(), 0, 14, Math.PI / 5.5, 0.35, 1.4);
      spot.position.set(0, -0.04, 0);
      spot.target.position.set(Math.sin(rotY) * 0.15, -3, Math.cos(rotY) * 0.15);
      enableLightShadows(spot, 512, 14);
      group.add(spot, spot.target);
      lamp = { type: "spot", light: spot, gain: 28 };
    } else {
      // Bulbs: point lights do NOT cast shadows (cube maps × many fixtures kill WebGL)
      mesh = new THREE.Mesh(new THREE.SphereGeometry(0.09, 24, 18), mat);
      const pt = new THREE.PointLight(col.getHex(), 0, 8 + power * 5, 1.6);
      pt.position.set(0, -0.06, 0);
      pt.castShadow = false;
      group.add(pt);
      lamp = { type: "point", light: pt, gain: 2.6 };
    }
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData = { kind: "light", id: l.id };
    group.add(mesh);
    root.add(group);
    lightMeshes[l.id] = { bulb: mesh, lamp, def: l, group, shape };
    movableRoots[movKey("light", l.id)] = group;
    clickables.push(mesh);
  }
  for (const f of doc.fans || []) {
    const hang = Math.max(0.08, (f.hangMm || 320) * M);
    const dia = (f.diameterMm || 1200) * M;
    const ceilingY = defaultH;
    const motorY = ceilingY - hang;
    const group = new THREE.Group();
    group.position.set(px(f.x), (f.elevMm || 0) * M, pz(f.y));

    const metal = new THREE.MeshStandardMaterial({
      color: f.on ? 0x3d9a6a : 0x8a939c,
      metalness: 0.55,
      roughness: 0.35,
    });
    const metalDark = new THREE.MeshStandardMaterial({
      color: 0x5a6570,
      metalness: 0.65,
      roughness: 0.3,
    });

    // Ceiling canopy (mount plate)
    const canopy = new THREE.Mesh(
      new THREE.CylinderGeometry(dia * 0.07, dia * 0.08, 0.035, 28),
      metalDark,
    );
    canopy.position.y = ceilingY - 0.02;
    canopy.userData = { kind: "fan", id: f.id };
    group.add(canopy);

    // Downrod / hanging pipe
    const rodR = Math.max(0.008, dia * 0.012);
    const rodLen = Math.max(0.05, hang - 0.08);
    const rod = new THREE.Mesh(
      new THREE.CylinderGeometry(rodR, rodR, rodLen, 20),
      metalDark,
    );
    rod.position.y = ceilingY - 0.04 - rodLen / 2;
    rod.userData = { kind: "fan", id: f.id };
    group.add(rod);

    // Ball joint / coupler at bottom of rod
    const coupler = new THREE.Mesh(
      new THREE.SphereGeometry(rodR * 1.8, 20, 16),
      metal,
    );
    coupler.position.y = motorY + 0.05;
    group.add(coupler);

    // Spinning rotor: motor housing + blades
    const rotor = new THREE.Group();
    rotor.position.y = motorY;

    const motor = new THREE.Mesh(
      new THREE.CylinderGeometry(dia * 0.09, dia * 0.1, 0.07, 28),
      metal,
    );
    motor.userData = { kind: "fan", id: f.id };
    rotor.add(motor);

    // Bottom cap / light kit disc
    const cap = new THREE.Mesh(
      new THREE.CylinderGeometry(dia * 0.06, dia * 0.07, 0.025, 24),
      metalDark,
    );
    cap.position.y = -0.045;
    rotor.add(cap);

    const blades = f.blades || 3;
    const bladeMat = new THREE.MeshStandardMaterial({
      color: f.on ? 0x5fb88a : 0x9aa3ae,
      side: THREE.DoubleSide,
      roughness: 0.7,
    });
    for (let i = 0; i < blades; i++) {
      const blade = new THREE.Mesh(
        boxGeo(dia * 0.42, 0.012, dia * 0.11),
        bladeMat.clone(),
      );
      blade.position.set(dia * 0.26, 0.01, 0);
      blade.rotation.z = -0.08;
      const pivot = new THREE.Group();
      pivot.rotation.y = (i * 2 * Math.PI) / blades;
      pivot.add(blade);
      rotor.add(pivot);
    }
    // Keep initial plan rotation on blades only via rotor base yaw
    rotor.rotation.y = -((f.rotationDeg || 0) * Math.PI) / 180;
    group.add(rotor);

    root.add(group);
    fanMeshes[f.id] = { group, rotor, def: f };
    movableRoots[movKey("fan", f.id)] = group;
    clickables.push(canopy, rod, motor);
  }
  for (const s of doc.sockets || []) {
    const style = s.style || "single";
    const defaultElev =
      style === "floor" ? HEIGHT_PRESETS.socketFloor
        : (style === "panel" || style === "board") ? HEIGHT_PRESETS.panelBoard
          : HEIGHT_PRESETS.socket;
    const elevMm = s.elevMm != null ? Number(s.elevMm) : defaultElev;
    const mesh = new THREE.Mesh(
      boxGeo(style === "panel" ? 0.22 : 0.08, style === "panel" ? 0.32 : 0.12, 0.04),
      new THREE.MeshStandardMaterial({ color: style === "panel" ? 0x3a4550 : 0xd8dde6 }),
    );
    mesh.position.set(px(s.x), elevMm * M, pz(s.y));
    mesh.rotation.y = -((s.rotationDeg || 0) * Math.PI) / 180;
    mesh.userData = { kind: "socket", id: s.id };
    root.add(mesh);
    movableRoots[movKey("socket", s.id)] = mesh;
    clickables.push(mesh);
  }
  for (const c of doc.cabinets || []) addCabinetMesh(c);
  // drop selection entries that no longer exist
  selection = selection.filter((s) => findDocObj(s.kind, s.id));
  applyVisibilityFlags();
  applyState();
  updateSelectRings();
  syncHudMode();
  fitSunShadowToScene();
  if (shouldFit) fitCamera();
  else syncSceneGuides();
}

function hexToThreeColor(hex, fallback = 0x8a7050) {
  const s = String(hex || "").trim();
  if (/^#[0-9a-fA-F]{6}$/i.test(s)) return parseInt(s.slice(1), 16);
  return fallback;
}
function tintMat(base, hex, opts = {}) {
  const mat = base.clone();
  mat.color.setHex(hexToThreeColor(hex, base.color.getHex()));
  if (opts.roughness != null) mat.roughness = opts.roughness;
  if (opts.transparent) {
    mat.transparent = true;
    mat.opacity = opts.opacity ?? 0.75;
    mat.side = THREE.DoubleSide;
    mat.depthWrite = false;
  }
  return mat;
}

function addCabinetMesh(c) {
  const type = c.type || "cabinet";
  const w = (c.widthMm || 1200) * M;
  const d = (c.depthMm || 600) * M;
  const h = Math.max(0.02, (c.heightMm || 900) * M);
  const colorHex = c.colorHex || null;
  const group = new THREE.Group();
  let elev = h / 2;
  if (type === "cabinet" && c.kind === "wall") elev = 1.4 + h / 2;
  if (type === "rug" || type === "runner") elev = 0.01;
  if (type === "curtain" || type === "curtain_sheer" || type === "curtain_wide" || type === "blinds" || type === "mirror" || type === "tv" || type === "wall_art") elev = h / 2;
  if (type === "range_hood") elev = 1.6 + h / 2;
  elev += (c.elevMm || 0) * M;
  group.position.set(px(c.x), elev, pz(c.y));
  group.rotation.y = -((c.rotationDeg || 0) * Math.PI) / 180;
  movableRoots[movKey("cabinet", c.id)] = group;

  const mark = (mesh) => {
    mesh.userData = { kind: "cabinet", id: c.id };
    clickables.push(mesh);
    return mesh;
  };
  const box = (bw, bh, bd, mat, x = 0, y = 0, z = 0) => {
    const soft = Math.min(0.024, Math.min(bw, bh, bd) * 0.16);
    const m = new THREE.Mesh(boxGeo(bw, bh, bd, soft), mat);
    m.position.set(x, y, z);
    m.castShadow = true;
    m.receiveShadow = true;
    group.add(m);
    return m;
  };
  const wood = colorHex ? tintMat(furnMats.wood, colorHex) : furnMats.wood;
  const fabric = colorHex ? tintMat(furnMats.fabric, colorHex) : furnMats.fabric;
  const fabricDark = colorHex ? tintMat(furnMats.fabricDark, colorHex) : furnMats.fabricDark;

  if (type === "curtain" || type === "curtain_sheer" || type === "curtain_wide" || type === "blinds") {
    const style = c.curtainStyle || (type === "blinds" ? "horizontal" : type === "curtain_sheer" ? "sheer" : "cloth");
    const foldMode = c.foldMode === "left" || c.foldMode === "right" ? c.foldMode : "both";
    const rodMat = cabinetHandleMat;
    mark(box(w + 0.08, 0.025, 0.025, rodMat, 0, h / 2 - 0.02, 0));
    box(0.03, 0.03, 0.03, rodMat, -w / 2 - 0.04, h / 2 - 0.02, 0);
    box(0.03, 0.03, 0.03, rodMat, w / 2 + 0.04, h / 2 - 0.02, 0);

    const entry = {
      id: c.id,
      style,
      foldMode,
      group,
      w,
      h,
      vanes: [],
      slats: [],
      folds: [],
      panels: [],
      cloth: [],
      ties: [],
    };

    if (style === "vertical") {
      const mat = makeCurtainMat(colorHex || "#a8b0ba", false);
      mat.roughness = 0.55;
      const n = Math.max(8, Math.round(w / 0.09));
      const vaneW = Math.max(0.035, (w * 0.94) / n);
      for (let i = 0; i < n; i++) {
        const u = n <= 1 ? 0.5 : i / (n - 1);
        const closedX = -w / 2 + 0.03 + vaneW * (i + 0.5);
        let openX = closedX;
        if (foldMode === "left") openX = -w / 2 + 0.04 + (u * w * 0.22);
        else if (foldMode === "right") openX = w / 2 - 0.04 - ((1 - u) * w * 0.22);
        else openX = -w / 2 + 0.04 + u * w * 0.2;
        const vane = new THREE.Mesh(
          boxGeo(vaneW * 0.82, h * 0.92, Math.max(d, 0.018)),
          mat,
        );
        vane.position.set(closedX, -0.02, 0);
        vane.castShadow = true;
        vane.userData = { kind: "cabinet", id: c.id };
        group.add(vane);
        clickables.push(vane);
        entry.vanes.push({ mesh: vane, closedX, openX, closedRot: 0, openRot: foldMode === "both" ? 0.85 : 1.05 });
      }
    } else if (style === "horizontal") {
      const mat = makeCurtainMat(colorHex || "#a8b0ba", false);
      mat.roughness = 0.5;
      const n = Math.max(12, Math.round(h / 0.055));
      const slatH = (h * 0.9) / n;
      for (let i = 0; i < n; i++) {
        const closedY = h / 2 - 0.06 - slatH * (i + 0.5) - h / 2;
        const openY = h / 2 - 0.06 - (h * 0.18 * i) / Math.max(1, n - 1) - h / 2;
        const slat = new THREE.Mesh(
          boxGeo(w * 0.95, Math.max(0.006, slatH * 0.65), Math.max(d, 0.028)),
          mat,
        );
        slat.position.set(0, closedY, 0);
        slat.castShadow = true;
        slat.userData = { kind: "cabinet", id: c.id };
        group.add(slat);
        clickables.push(slat);
        entry.slats.push({ mesh: slat, closedY, openY, closedRot: 0, openRot: 0.75 });
      }
    } else if (style === "roman") {
      const mat = makeCurtainMat(colorHex || "#c4b59a", false);
      const n = 6;
      const foldH = (h * 0.92) / n;
      for (let i = 0; i < n; i++) {
        const closedY = h / 2 - 0.04 - foldH * (i + 0.5) - h / 2;
        // Raised: stack under the rod with accordion offset
        const openY = h / 2 - 0.06 - foldH * 0.35 * (i + 0.5) - h / 2;
        const panel = new THREE.Mesh(
          boxGeo(w * 0.96, foldH * 0.88, Math.max(d, 0.035)),
          mat,
        );
        panel.position.set(0, closedY, 0);
        panel.castShadow = true;
        panel.userData = { kind: "cabinet", id: c.id };
        group.add(panel);
        clickables.push(panel);
        entry.folds.push({
          mesh: panel,
          closedY,
          openY,
          closedZ: 0,
          openZ: (i % 2 === 0 ? 1 : -1) * 0.028,
          closedScaleY: 1,
          openScaleY: 0.72,
        });
      }
    } else if (style === "panel") {
      const mat = makeCurtainMat(colorHex || "#c4b59a", false);
      const n = 4;
      const pw = (w * 0.96) / n;
      for (let i = 0; i < n; i++) {
        const closedX = -w / 2 + pw * (i + 0.5) + 0.01;
        let openX = closedX;
        if (foldMode === "right") openX = w / 2 - pw * 0.55 - (n - 1 - i) * pw * 0.22;
        else openX = -w / 2 + pw * 0.55 + i * pw * 0.22; // left / both stack left
        const panel = new THREE.Mesh(
          boxGeo(pw * 0.92, h * 0.94, Math.max(d, 0.03)),
          mat,
        );
        panel.position.set(closedX, -0.02, i * 0.008);
        panel.castShadow = true;
        panel.userData = { kind: "cabinet", id: c.id };
        group.add(panel);
        clickables.push(panel);
        entry.panels.push({ mesh: panel, closedX, openX, closedZ: i * 0.008, openZ: i * 0.014 });
      }
    } else {
      // cloth / sheer — draw + pleat fold + airflow
      const sheer = style === "sheer";
      const mat = makeCurtainMat(colorHex || (sheer ? "#e8e0d0" : "#c4b59a"), sheer);
      const panelW = w * 0.485;
      const panelH = h * 0.94;
      const openW = w * 0.2;
      const openScale = openW / panelW;
      const sides = foldMode === "left" ? [-1, -1] : foldMode === "right" ? [1, 1] : [-1, 1];
      for (let i = 0; i < 2; i++) {
        const side = sides[i] || (i === 0 ? -1 : 1);
        const closedX = i === 0 ? -w / 2 + panelW / 2 + 0.015 : w / 2 - panelW / 2 - 0.015;
        let openX;
        if (foldMode === "left") openX = -w / 2 + openW / 2 + 0.02 + i * openW * 0.85;
        else if (foldMode === "right") openX = w / 2 - openW / 2 - 0.02 - (1 - i) * openW * 0.85;
        else openX = side < 0 ? -w / 2 + openW / 2 + 0.02 : w / 2 - openW / 2 - 0.02;

        const geo = new THREE.PlaneGeometry(panelW, panelH, 14, 28);
        const pos = geo.attributes.position;
        const rest = new Float32Array(pos.count * 3);
        for (let vi = 0; vi < pos.count; vi++) {
          const x = pos.getX(vi);
          const y = pos.getY(vi);
          const u = x / panelW + 0.5;
          const pleat = Math.sin(u * Math.PI * 7) * (sheer ? 0.008 : 0.014);
          const hem = Math.sin(u * Math.PI * 2) * 0.004 * Math.max(0, 0.5 - y / panelH);
          pos.setZ(vi, pleat + hem);
          rest[vi * 3] = x;
          rest[vi * 3 + 1] = y;
          rest[vi * 3 + 2] = pos.getZ(vi);
        }
        geo.computeVertexNormals();
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(closedX, -0.02, 0);
        mesh.castShadow = !sheer;
        mesh.receiveShadow = true;
        mesh.userData = { kind: "cabinet", id: c.id };
        group.add(mesh);
        clickables.push(mesh);
        entry.cloth.push({
          mesh,
          rest,
          side: side < 0 ? -1 : 1,
          panelW,
          panelH,
          closedX,
          openX,
          openScale,
          sheer,
          drawT: 0,
        });
      }
      // Soft tiebacks (visible when drawn)
      for (const side of foldMode === "both" ? [-1, 1] : [foldMode === "left" ? -1 : 1]) {
        const tie = new THREE.Mesh(
          new THREE.TorusGeometry(0.04, 0.008, 6, 16),
          cabinetHandleMat,
        );
        tie.rotation.y = Math.PI / 2;
        tie.position.set(side * (w * 0.42), -h * 0.08, 0.06);
        tie.visible = false;
        group.add(tie);
        entry.ties.push(tie);
      }
    }

    curtainMeshes[c.id] = entry;
    if (curtainAnim[c.id] == null) curtainAnim[c.id] = c.open ? 1 : 0;
    applyCurtainPose(entry, curtainAnim[c.id]);
  } else if (type === "rug" || type === "runner") {
    mark(box(w, 0.02, d, colorHex ? tintMat(furnMats.rug, colorHex) : furnMats.rug));
  } else if (type === "plant") {
    const pot = mark(box(w * 0.45, h * 0.18, d * 0.45, furnMats.darkWood, 0, -h * 0.4, 0));
    const foliage = new THREE.Mesh(new THREE.SphereGeometry(Math.min(w, d) * 0.45, 20, 16), tintMat(furnMats.fabric, colorHex || "#3d7a4a"));
    foliage.position.set(0, h * 0.05, 0);
    group.add(foliage);
    void pot;
  } else if (type === "mirror") {
    mark(box(w, h, Math.max(d, 0.02), tintMat(furnMats.metal, colorHex || "#a8c4d8", { roughness: 0.15 })));
    box(w * 0.92, h * 0.92, 0.01, new THREE.MeshStandardMaterial({ color: 0xc8d8e8, metalness: 0.6, roughness: 0.15 }), 0, 0, -Math.max(d, 0.02) / 2 - 0.005);
  } else if (type === "floor_lamp") {
    box(0.04, h * 0.85, 0.04, furnMats.metal, 0, -h * 0.05, 0);
    mark(box(w * 0.7, h * 0.2, d * 0.7, tintMat(furnMats.fabric, colorHex || "#c9a227"), 0, h * 0.35, 0));
  } else if (type === "bed" || type === "bed_single" || type === "bed_king") {
    mark(box(w, h * 0.45, d, wood, 0, -h * 0.2, 0));
    const mattress = box(w * 0.92, h * 0.35, d * 0.88, colorHex ? tintMat(furnMats.pillow, colorHex) : furnMats.pillow, 0, h * 0.05, d * 0.02);
    mark(mattress);
    box(w, h * 0.9, 0.06, furnMats.darkWood, 0, h * 0.15, -d / 2 + 0.03);
    box(w * 0.36, h * 0.12, d * 0.12, fabric, -w * 0.22, h * 0.28, -d * 0.32);
    box(w * 0.36, h * 0.12, d * 0.12, fabric, w * 0.22, h * 0.28, -d * 0.32);
  } else if (type === "sofa" || type === "sofa_loveseat" || type === "armchair" || type === "ottoman"
    || type === "chaise" || type === "recliner" || type === "sofa_sectional" || type === "sofa_corner") {
    mark(box(w, h * 0.4, d * 0.85, fabric, 0, -h * 0.15, d * 0.05));
    if (type !== "ottoman") {
      box(w * 0.92, h * 0.45, d * (type === "chaise" ? 0.16 : 0.22), fabricDark, 0, h * 0.1, -d * 0.32);
      box(w * 0.1, h * 0.55, d * 0.85, fabricDark, -w * 0.45, 0, 0);
      if (type !== "chaise") box(w * 0.1, h * 0.55, d * 0.85, fabricDark, w * 0.45, 0, 0);
    }
    if (type === "sofa_sectional" || type === "sofa_corner") {
      box(w * 0.35, h * 0.4, d * 0.55, fabric, w * 0.32, -h * 0.15, d * 0.2);
    }
  } else if (type === "dining_table" || type === "coffee_table" || type === "desk" || type === "console"
    || type === "side_table" || type === "nest_tables" || type === "bar_table" || type === "round_table") {
    if (type === "round_table") {
      const top = new THREE.Mesh(new THREE.CylinderGeometry(w / 2, w / 2, 0.05, 28), wood);
      top.position.y = h / 2 - 0.025;
      mark(top);
      group.add(top);
      box(0.08, h - 0.05, 0.08, furnMats.darkWood, 0, 0, 0);
    } else {
      mark(box(w, 0.05, d, wood, 0, h / 2 - 0.025, 0));
      const leg = 0.05;
      const ox = w * 0.4, oz = d * 0.4;
      for (const [lx, lz] of [[-ox, -oz], [ox, -oz], [-ox, oz], [ox, oz]]) {
        box(leg, h - 0.05, leg, furnMats.darkWood, lx, 0, lz);
      }
    }
  } else if (type === "chair" || type === "barstool" || type === "dining_chair" || type === "office_chair" || type === "bench") {
    mark(box(w, 0.06, d * 0.7, wood, 0, -h * 0.15, d * 0.05));
    if (type !== "bench") box(w, h * 0.55, 0.05, wood, 0, h * 0.15, -d * 0.35);
    for (const [lx, lz] of [[-w * 0.35, -d * 0.25], [w * 0.35, -d * 0.25], [-w * 0.35, d * 0.3], [w * 0.35, d * 0.3]]) {
      box(0.04, h * 0.45, 0.04, furnMats.darkWood, lx, -h * 0.25, lz);
    }
  } else if (type === "toilet") {
    const bowl = new THREE.Mesh(new THREE.CylinderGeometry(w * 0.35, w * 0.4, h * 0.35, 24), furnMats.ceramic);
    bowl.position.set(0, -h * 0.15, d * 0.1);
    mark(bowl);
    group.add(bowl);
    box(w * 0.75, h * 0.45, d * 0.28, furnMats.ceramic, 0, h * 0.1, -d * 0.28);
  } else if (type === "bathtub") {
    mark(box(w, h * 0.7, d, furnMats.ceramic));
    const water = new THREE.Mesh(boxGeo(w * 0.75, 0.04, d * 0.65), furnMats.water);
    water.position.y = h * 0.15;
    group.add(water);
  } else if (type === "shower") {
    mark(box(w, 0.04, d, furnMats.ceramic, 0, -h / 2 + 0.02, 0));
    // glass panels
    const glass = new THREE.MeshStandardMaterial({ color: 0xa8c0d0, transparent: true, opacity: 0.35, roughness: 0.2, metalness: 0.1, side: THREE.DoubleSide });
    box(0.02, h * 0.9, d * 0.95, glass, -w / 2 + 0.01, 0, 0);
    box(w * 0.95, h * 0.9, 0.02, glass, 0, 0, -d / 2 + 0.01);
  } else if (type === "fridge" || type === "washer" || type === "dishwasher") {
    mark(box(w, h, d, colorHex ? tintMat(furnMats.appliance, colorHex) : furnMats.appliance));
    box(0.02, h * 0.9, 0.01, furnMats.metal, 0, 0, -d / 2 - 0.01);
  } else if (type === "stove") {
    mark(box(w, h * 0.75, d, furnMats.stove, 0, -h * 0.05, 0));
    box(w, 0.04, d, furnMats.metal, 0, h * 0.35, 0);
    for (const [ox, oz] of [[-0.22, -0.18], [0.22, -0.18], [-0.22, 0.18], [0.22, 0.18]]) {
      const burner = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.02, 24), cabinetHandleMat);
      burner.position.set(ox * w, h * 0.38, oz * d);
      group.add(burner);
    }
  } else if (type === "sink" || type === "vanity") {
    mark(box(w, h * 0.7, d, wood, 0, -h * 0.05, 0));
    const basin = new THREE.Mesh(new THREE.CylinderGeometry(Math.min(w, d) * 0.28, Math.min(w, d) * 0.3, 0.12, 28), furnMats.metal);
    basin.position.set(0, h * 0.28, 0);
    group.add(basin);
  } else if (type === "bookshelf" || type === "tvstand" || type === "nightstand" || type === "dresser" || type === "sideboard") {
    mark(box(w, h, d, wood));
    const shelves = type === "bookshelf" ? 4 : type === "dresser" ? 3 : 2;
    for (let i = 1; i < shelves; i++) {
      box(w * 0.92, 0.02, d * 0.9, furnMats.darkWood, 0, -h / 2 + (h * i) / shelves, 0);
    }
  } else if (type === "wardrobe" || type === "cabinet" || type === "kitchen_island") {
    const kind = type === "wardrobe" ? "tall" : (c.kind || "base");
    const isWall = kind === "wall";
    const isDrawer = kind === "drawer";
    const isBase = kind === "base" || kind === "drawer" || type === "kitchen_island";
    const doors = Math.max(1, Math.min(6, Number(c.doors) || (type === "wardrobe" ? 3 : 2)));
    const drawers = Math.max(2, Math.min(5, Number(c.drawers) || 3));
    const bodyMat = colorHex ? tintMat(cabinetMat, colorHex) : cabinetMat;
    const doorMat = colorHex ? tintMat(cabinetDoorMat, colorHex) : cabinetDoorMat;
    const kickH = isWall ? 0 : 0.1;
    const counterT = isBase && kind !== "tall" ? 0.036 : 0;
    const carcassH = Math.max(0.2, h - kickH - counterT);
    const carcassY = -h / 2 + kickH + carcassH / 2;

    // Toe kick
    if (kickH > 0) {
      box(w * 0.92, kickH, d * 0.88, furnMats.darkWood, 0, -h / 2 + kickH / 2, 0.02);
    }
    // Carcass
    const carcass = mark(box(w, carcassH, d, bodyMat, 0, carcassY, 0));
    // Back panel inset
    box(w * 0.96, carcassH * 0.96, 0.012, furnMats.darkWood, 0, carcassY, d / 2 - 0.01);

    // Countertop for base / island / drawers
    if (counterT > 0) {
      const oh = type === "kitchen_island" ? 0.025 : 0.018;
      box(w + oh * 2, counterT, d + oh, furnMats.counter || furnMats.darkWood, 0, h / 2 - counterT / 2, -oh * 0.3);
    }

    if (isDrawer) {
      const usable = carcassH * 0.92;
      const frontH = usable / drawers;
      for (let i = 0; i < drawers; i++) {
        const fy = carcassY - carcassH / 2 + frontH * (i + 0.5) + carcassH * 0.04;
        const front = new THREE.Mesh(
          boxGeo(w * 0.96, Math.max(0.04, frontH - 0.006), 0.016, 0.005),
          doorMat,
        );
        front.position.set(0, fy, -d / 2 - 0.008);
        front.castShadow = true;
        const handle = new THREE.Mesh(
          boxGeo(Math.min(0.12, w * 0.25), 0.012, 0.012, 0.004),
          cabinetHandleMat,
        );
        handle.position.set(0, 0, -0.014);
        front.add(handle);
        group.add(front);
      }
    } else {
      const leafW = w / doors;
      const doorT = 0.016;
      const doorH = carcassH * 0.96;
      for (let i = 0; i < doors; i++) {
        const leaf = new THREE.Mesh(
          boxGeo(Math.max(0.04, leafW - 0.004), doorH, doorT, 0.005),
          doorMat,
        );
        const handle = new THREE.Mesh(
          boxGeo(0.012, isWall ? 0.05 : 0.09, 0.012, 0.003),
          cabinetHandleMat,
        );
        if (c.open) {
          const hingeLeft = i % 2 === 0;
          const pivot = new THREE.Group();
          const hingeX = hingeLeft ? -w / 2 + leafW * i : -w / 2 + leafW * (i + 1);
          pivot.position.set(hingeX, carcassY, -d / 2);
          leaf.position.set(hingeLeft ? leafW / 2 : -leafW / 2, 0, -doorT / 2);
          handle.position.set(hingeLeft ? leafW * 0.82 : -leafW * 0.82, 0, -doorT - 0.01);
          leaf.add(handle);
          pivot.add(leaf);
          pivot.rotation.y = hingeLeft ? 1.05 : -1.05;
          group.add(pivot);
        } else {
          leaf.position.set(-w / 2 + leafW * (i + 0.5), carcassY, -d / 2 - doorT / 2);
          handle.position.set((i % 2 === 0 ? 1 : -1) * leafW * 0.28, doorH * 0.05, -doorT - 0.01);
          leaf.add(handle);
          group.add(leaf);
        }
      }
    }
    // Wall cabinet underside lip
    if (isWall) {
      box(w * 0.98, 0.02, 0.04, furnMats.darkWood, 0, -h / 2 + 0.01, -d / 2 + 0.02);
    }
    void carcass;
  } else {
    mark(box(w, h, d, wood));
  }

  root.add(group);
}

function fitCamera() {
  const box = new THREE.Box3().setFromObject(root);
  if (box.isEmpty()) return;
  const center = new THREE.Vector3();
  const size = new THREE.Vector3();
  box.getCenter(center);
  box.getSize(size);
  const maxDim = Math.max(size.x, size.z, 1);
  const dist = Math.max(maxDim * 1.35, 6);
  controls.target.copy(center);
  camera.up.set(0, 1, 0);
  camera.position.set(center.x + dist * 0.55, Math.max(center.y + dist * 0.75, size.y + 2), center.z + dist * 0.55);
  camera.near = Math.max(0.05, dist / 200);
  camera.far = Math.max(200, dist * 25);
  camera.updateProjectionMatrix();
  controls.update();
  syncSceneGuides();
}

function applyDoorPose(m, t) {
  if (!m) return;
  const openAngle = m.openAngle ?? 85;
  const swingSign = m.swingSign ?? 1;
  const leafSign = m.leafSign ?? 1;
  const delta = -swingSign * leafSign * (openAngle * Math.PI) / 180;
  const k = Math.max(0, Math.min(1, t));
  // ease-out cubic for a natural swing
  const e = 1 - (1 - k) ** 3;
  if (m.style === "sliding" || m.style === "pocket") {
    const closed = m.slideClosed ?? 0.3;
    const openX = m.slideOpen ?? 0.75;
    m.leaf.position.x = closed + (openX - closed) * e;
    m.pivot.rotation.y = m.base;
  } else if (m.style === "double" && m.leafR) {
    m.pivot.rotation.y = m.base;
    m.leaf.rotation.y = delta * e;
    if (m.rightPivot) m.rightPivot.rotation.y = -delta * e;
    else m.leafR.rotation.y = -delta * e;
  } else if (m.style === "bifold" && m.fold) {
    m.pivot.rotation.y = m.base + delta * 0.5 * e;
    m.fold.rotation.y = delta * 0.5 * e;
  } else {
    m.pivot.rotation.y = m.base + delta * e;
  }
  // Closed = solid wall to light; open = hole lets sun / fixtures through
  if (m.occluder) {
    m.occluder.castShadow = k < 0.2;
    m.occluder.visible = k < 0.45;
  }
}

/** Draw / raise / fold pose for curtains & blinds (0=closed, 1=open). */
function applyCurtainPose(entry, t) {
  if (!entry) return;
  const k = Math.max(0, Math.min(1, t));
  const e = 1 - (1 - k) ** 2.4;
  if (entry.vanes?.length) {
    for (const v of entry.vanes) {
      v.mesh.position.x = v.closedX + (v.openX - v.closedX) * e;
      v.mesh.rotation.y = v.closedRot + (v.openRot - v.closedRot) * e;
    }
  }
  if (entry.slats?.length) {
    for (const s of entry.slats) {
      s.mesh.position.y = s.closedY + (s.openY - s.closedY) * e;
      s.mesh.rotation.x = s.closedRot + (s.openRot - s.closedRot) * e;
    }
  }
  if (entry.folds?.length) {
    for (const f of entry.folds) {
      f.mesh.position.y = f.closedY + (f.openY - f.closedY) * e;
      f.mesh.position.z = f.closedZ + (f.openZ - f.closedZ) * e;
      f.mesh.scale.y = f.closedScaleY + (f.openScaleY - f.closedScaleY) * e;
    }
  }
  if (entry.panels?.length) {
    for (const p of entry.panels) {
      p.mesh.position.x = p.closedX + (p.openX - p.closedX) * e;
      p.mesh.position.z = p.closedZ + (p.openZ - p.closedZ) * e;
    }
  }
  if (entry.cloth?.length) {
    for (const p of entry.cloth) {
      p.mesh.position.x = p.closedX + (p.openX - p.closedX) * e;
      p.mesh.scale.x = 1 + (p.openScale - 1) * e;
      p.drawT = e;
      // Gathered pleats deepen as fabric stacks
      const pos = p.mesh.geometry.attributes.position;
      const rest = p.rest;
      const pleatBoost = 1 + e * 1.8;
      for (let i = 0; i < pos.count; i++) {
        pos.setX(i, rest[i * 3]);
        pos.setY(i, rest[i * 3 + 1]);
        pos.setZ(i, rest[i * 3 + 2] * pleatBoost);
      }
      pos.needsUpdate = true;
    }
  }
  for (const tie of entry.ties || []) tie.visible = e > 0.55;
}

function applyState() {
  if (!doc) return;
  for (const d of doc.doors || []) {
    const m = doorMeshes[d.id];
    if (!m) continue;
    if (doorAnim[d.id] == null) doorAnim[d.id] = d.open ? 1 : 0;
    applyDoorPose(m, doorAnim[d.id]);
  }
  for (const l of doc.lights || []) {
    const m = lightMeshes[l.id];
    if (!m?.lamp) continue;
    const on = !!l.on;
    const power = Math.max(0, Number(l.intensity ?? 1));
    const col = kelvinToRgb(l.colorTempK || 3000);
    m.lamp.light.intensity = on ? m.lamp.gain * power : 0;
    if (m.lamp.light.color) m.lamp.light.color.copy(col);
    if (m.lamp.shadow) {
      m.lamp.shadow.intensity = on ? (m.lamp.shadowGain || 16) * power : 0;
      if (m.lamp.shadow.color) m.lamp.shadow.color.copy(col);
    }
    if (m.lamp.type === "point") {
      m.lamp.light.distance = 8 + power * 5;
    }
    if (m.bulb.material.emissive) {
      m.bulb.material.emissive.copy(on ? col : new THREE.Color(0x000000));
      m.bulb.material.emissiveIntensity = on ? (m.shape === "spot" ? 1.8 : 1.2) : 0;
    }
    m.bulb.material.color.copy(on ? col : new THREE.Color(0x555555));
    // Keep lamp aim for spots when rotation changes live
    if (m.lamp.type === "spot" && m.lamp.light.target) {
      const rotY = -((l.rotationDeg || 0) * Math.PI) / 180;
      m.lamp.light.target.position.set(Math.sin(rotY) * 0.15, -3, Math.cos(rotY) * 0.15);
    }
  }
  for (const f of doc.fans || []) {
    const m = fanMeshes[f.id];
    if (!m?.group) continue;
    m.group.traverse((ch) => {
      if (!ch.material?.color || ch.material.map) return;
      // keep relative tones: canopy/rod stay darker when off
      const on = !!f.on;
      if (ch.geometry?.type === "BoxGeometry" || ch.geometry?.type === "RoundedBoxGeometry") {
        ch.material.color.set(on ? 0x5fb88a : 0x9aa3ae);
      } else {
        ch.material.color.set(on ? 0x3d9a6a : 0x6a7380);
      }
    });
  }
  for (const w of doc.windows || []) {
    if (windowAnim[w.id] == null) windowAnim[w.id] = w.open ? 1 : 0;
    const m = windowMeshes[w.id];
    if (m) applyWindowPose(m, windowAnim[w.id]);
  }
  for (const c of doc.cabinets || []) {
    if (!isCurtainFurn(c.type)) continue;
    if (curtainAnim[c.id] == null) curtainAnim[c.id] = c.open ? 1 : 0;
    const m = curtainMeshes[c.id];
    if (m) applyCurtainPose(m, curtainAnim[c.id]);
  }
  renderPanel();
}

function uid3(prefix) {
  return `${prefix}_${Math.random().toString(36).slice(2, 9)}`;

function applyLiveRotation(kind, id, deg) {
  const o = findDocObj(kind, id);
  if (!o) return;
  o.rotationDeg = ((deg % 360) + 360) % 360;
  if (kind === "light" && lightMeshes[id]) {
    const m = lightMeshes[id];
    const rad = -(o.rotationDeg * Math.PI) / 180;
    if (m.bulb) m.bulb.rotation.y = rad;
    if (m.lamp?.type === "area" && m.shape === "tube") m.lamp.light.rotation.z = rad;
    if (m.lamp?.type === "spot" && m.lamp.light.target) {
      m.lamp.light.target.position.set(Math.sin(rad) * 0.15, -3, Math.cos(rad) * 0.15);
    }
  } else if (kind === "fan" && fanMeshes[id]?.rotor) {
    fanMeshes[id].rotor.rotation.y = -(o.rotationDeg * Math.PI) / 180;
  } else {
    const g = movableRoots[movKey(kind, id)];
    if (g) g.rotation.y = -(o.rotationDeg * Math.PI) / 180;
  }
}

async function deleteSelected3d({ confirm: ask = true } = {}) {
  if (!selection.length || !doc) return;
  const items = selectionObjects();
  if (!items.length) return;
  const label = items.length === 1
    ? (items[0].o.label || items[0].o.type || items[0].kind)
    : `${items.length} objects`;
  if (ask && !window.confirm(`Delete ${label}?`)) return;
  pushHistory();
  for (const { kind, id } of items) {
    if (kind === "door") doc.doors = (doc.doors || []).filter((d) => d.id !== id);
    else if (kind === "window") {
      const win = (doc.windows || []).find((w) => w.id === id);
      doc.windows = (doc.windows || []).filter((w) => w.id !== id);
      if (win?.openingId) {
        doc.openings = (doc.openings || []).filter((op) => op.id !== win.openingId);
        doc.doors = (doc.doors || []).filter((d) => d.openingId !== win.openingId);
      }
    } else if (kind === "light") doc.lights = (doc.lights || []).filter((l) => l.id !== id);
    else if (kind === "fan") doc.fans = (doc.fans || []).filter((f) => f.id !== id);
    else if (kind === "socket") doc.sockets = (doc.sockets || []).filter((s) => s.id !== id);
    else if (kind === "cabinet") doc.cabinets = (doc.cabinets || []).filter((c) => c.id !== id);
  }
  selection = [];
  await persist();
  rebuild();
}

async function duplicateSelected3d() {
  if (!selection.length || !doc) return;
  const items = selectionObjects().filter((it) => isMovableKind(it.kind));
  if (!items.length) return;
  pushHistory();
  const created = [];
  for (const it of items) {
    const copy = placeNear(it.kind, it.o, it.o.x || 0, it.o.y || 0);
    if (!copy) continue;
    pushKindObj(it.kind, copy);
    created.push({ kind: it.kind, id: copy.id });
  }
  if (!created.length) {
    window.alert("No free space nearby to place duplicates (walls/rooms).");
    return;
  }
  await persist();
  rebuild();
  selection = created;
  updateSelectRings();
  renderPanel();
}

async function nudgeSelected3d(dxMm, dyMm) {
  const items = selectionObjects().filter((it) => isMovableKind(it.kind) && it.o.x != null && !it.o.locked);
  if (!items.length) return;
  if (layoutLocked) setLayoutLocked(false);
  const walls = wallNet.length ? wallNet : (doc?.walls || []);
  const ignoreIds = new Set(items.map((it) => `${it.kind}:${it.id}`));
  const nexts = [];
  for (const it of items) {
    const sticky = (it.kind === "light" || it.kind === "fan")
      ? findRoomAt(doc, { x: it.o.x, y: it.o.y })
      : null;
    const resolved = resolveMove({
      doc,
      kind: it.kind,
      obj: it.o,
      fromX: it.o.x,
      fromY: it.o.y,
      toX: it.o.x + dxMm,
      toY: it.o.y + dyMm,
      walls,
      stickyRoom: sticky,
      ignoreIds,
      snapFn: snapPlan,
    });
    if (!resolved) return;
    nexts.push({ it, next: resolved });
  }
  pushHistory();
  for (const { it, next } of nexts) applyWorldPos(it.kind, it.id, next.x, next.y);
  await persist();
  renderPanel();
}

async function rotateSelected3d(delta) {
  const items = selectionObjects().filter((it) => isMovableKind(it.kind) && !it.o.locked);
  if (!items.length) return;
  for (const it of items) {
    const next = (Number(it.o.rotationDeg) || 0) + delta;
    const probe = { ...it.o, rotationDeg: next };
    if (it.o.x != null && !placementAllowed(it.kind, probe, it.o.x, it.o.y)) return;
  }
  pushHistory();
  for (const it of items) {
    const next = (Number(it.o.rotationDeg) || 0) + delta;
    applyLiveRotation(it.kind, it.id, next);
  }
  await persist();
  renderPanel();
}

function multiField(label, prop, type = "number", step = 10) {
  const items = selectionObjects().filter((it) => supportsMultiProp(it.kind, it.o, prop));
  if (!items.length || items.length < selectionObjects().length && prop !== "label") {
    // only show if ALL selected support it
  }
  const all = selectionObjects();
  if (!all.length || !all.every((it) => supportsMultiProp(it.kind, it.o, prop))) return "";
  const st = commonPropState(all, prop);
  const mixedCls = st.mixed ? " mixed" : "";
  const ph = st.mixed ? ' placeholder="Mixed"' : "";
  if (type === "color") {
    const val = st.mixed ? "#888888" : (st.value || "#c4b59a");
    return field(label, `<input data-prop="${prop}" data-multi="1" type="color" class="${mixedCls.trim()}" value="${val}" />`);
  }
  if (type === "text") {
    return field(label, `<input data-prop="${prop}" data-multi="1" type="text" class="${mixedCls.trim()}" value="${st.mixed ? "" : (st.value || "")}"${ph} />`);
  }
  return field(label, `<input data-prop="${prop}" data-multi="1" type="number" step="${step}" class="${mixedCls.trim()}" value="${st.mixed ? "" : st.value}"${ph} />`);
}

let dayUiBound = false;
function bindDayCycleUi() {
  if (dayUiBound) return;
  dayUiBound = true;
  panel.addEventListener("input", (e) => {
    if (e.target?.id === "dayTime") {
      if (dayCycle.syncRealtime) return;
      dayCycle.hours = Number(e.target.value) / 60;
      saveDayCycle();
      updateDayCycle();
    }
  });
  panel.addEventListener("change", (e) => {
    const t = e.target;
    if (!t) return;
    if (t.id === "daySyncRealtime") {
      dayCycle.syncRealtime = !!t.checked;
      if (dayCycle.syncRealtime) syncHoursFromClock(dayCycle);
      const doy = document.getElementById("dayOfYear");
      if (doy) doy.readOnly = !!dayCycle.syncRealtime;
      saveDayCycle();
      updateDayTimeUiVisibility();
      updateDayCycle();
      return;
    }
    if (t.id === "dayPreset") {
      dayCycle.preset = t.value;
      const p = LOCATION_PRESETS.find((x) => x.id === t.value);
      if (p) {
        dayCycle.lat = p.lat;
        dayCycle.lon = p.lon;
        const la = document.getElementById("dayLat");
        const lo = document.getElementById("dayLon");
        if (la) la.value = p.lat;
        if (lo) lo.value = p.lon;
      }
      saveDayCycle();
      updateDayCycle();
      return;
    }
    if (t.id === "dayOfYear") {
      if (dayCycle.syncRealtime) return;
      dayCycle.dayOfYear = Math.max(1, Math.min(365, Number(t.value) || 1));
      saveDayCycle();
      updateDayCycle();
    }
    if (t.id === "dayLat" || t.id === "dayLon") {
      dayCycle.lat = Number(document.getElementById("dayLat")?.value) || 0;
      dayCycle.lon = Number(document.getElementById("dayLon")?.value) || 0;
      dayCycle.preset = "custom";
      const ps = document.getElementById("dayPreset");
      if (ps) ps.value = "custom";
      saveDayCycle();
      updateDayCycle();
    }
  });
}

async function persist() {
  dirty = true;
  saveDraftLocal();
  try {
    if (activeModel?.id) {
      await Models.saveModelDoc(activeModel.id, doc);
    } else {
      await fetch("/api/layout", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-HTTP-Method-Override": "PUT",
          ...(Models.getActiveModelId() ? { "X-Model-Id": Models.getActiveModelId() } : {}),
        },
        body: JSON.stringify(doc),
      });
    }
    liveSync?.publish(doc, { source: "3d", saved: true });
  } catch { /* offline */ }
}

panel.addEventListener("click", async (e) => {
  const toggle = e.target.closest("[data-menu-toggle]");
  if (toggle) {
    e.preventDefault();
    e.stopPropagation();
    const id = toggle.dataset.menuToggle;
    panel.querySelectorAll(".menu.open").forEach((m) => {
      if (m.dataset.menu !== id) m.classList.remove("open");
    });
    toggle.closest(".menu")?.classList.toggle("open");
    return;
  }
  if (!e.target.closest(".menu.open")) {
    panel.querySelectorAll(".menu.open").forEach((m) => m.classList.remove("open"));
  }
  const btn = e.target.closest("button");
  if (btn && doc) {
    // handled below — prefer buttons over row pick
  } else {
    const pick = e.target.closest("[data-pick]");
    if (pick?.dataset.pick) {
      const additive = !!(e.shiftKey || e.metaKey || e.ctrlKey);
      setSelected(pick.dataset.pick, pick.dataset.id, { additive });
      return;
    }
  }
  if (!btn) return;
  if (btn.dataset.act === "toggle-panel") { togglePanel3d(); return; }
  if (!doc) return;
  if (btn.closest(".menu-panel")) btn.closest(".menu")?.classList.remove("open");
  if (btn.dataset.act === "deselect") { setSelected(null, null); return; }
  if (btn.dataset.act === "delete") { await deleteSelected3d(); return; }
  if (btn.dataset.act === "duplicate") { await duplicateSelected3d(); return; }
  if (btn.dataset.act === "rot-m") { await rotateSelected3d(-15); return; }
  if (btn.dataset.act === "rot-p") { await rotateSelected3d(15); return; }
  if (btn.dataset.act === "rot-90") { await rotateSelected3d(90); return; }
  if (btn.dataset.act === "nudge") {
    await nudgeSelected3d(Number(btn.dataset.dx) || 0, Number(btn.dataset.dy) || 0);
    return;
  }
  if (btn.dataset.act === "lock-layout") { setLayoutLocked(true); return; }
  if (btn.dataset.act === "unlock-layout") { setLayoutLocked(false); return; }
  if (btn.dataset.act === "undo") { undo(); return; }
  if (btn.dataset.act === "redo") { redo(); return; }
  if (btn.dataset.act === "save") { await saveShared3d(); return; }
  if (btn.dataset.act === "model-new") { await newModel3d(); return; }
  if (btn.dataset.act === "model-version") { await versionModel3d(); return; }
  if (btn.dataset.act === "model-share") {
    try {
      await ensureAuthed({ toast });
      await persist();
      const data = await Models.createShare(activeModel.id, { label: "Public link" });
      const full = Models.shareUrlFromPath(data.share?.url || `/view.html?t=${data.share?.token}`);
      try {
        await navigator.clipboard.writeText(full);
        toast("Share link copied");
      } catch {
        prompt("Share link", full);
      }
    } catch (err) {
      toast(String(err.message || err), "err");
    }
    return;
  }
  if (btn.dataset.act === "export-pack") {
    try {
      await ensureAuthed({ toast });
      const blob = await Models.exportPack(activeModel.id);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${(activeModel?.name || "model").replace(/[^a-zA-Z0-9._-]+/g, "_")}.zip`;
      a.click();
      URL.revokeObjectURL(a.href);
      toast("Export pack downloaded");
    } catch (err) {
      toast(String(err.message || err), "err");
    }
    return;
  }
  if (btn.dataset.act === "auth-login") {
    openAuthModal({ toast }).catch(() => {});
    return;
  }
  if (btn.dataset.act === "export") { exportJson3d(); return; }
  if (btn.dataset.act === "import") { document.getElementById("fileImport3d")?.click(); return; }
  if (btn.dataset.act === "reset") { await resetSeed3d(); return; }
  if (btn.dataset.act === "copy") { copySelected3d(); renderPanel(); return; }
  if (btn.dataset.act === "paste") { await pasteClipboard3d(); return; }
  if (btn.dataset.act === "reload") { await load({ forceFit: true }); return; }
  if (btn.dataset.act === "flooring") {
    const id = btn.dataset.floor;
    if (FLOORING[id]) {
      pushHistory();
      doc.flooring = id;
      applyFlooringStyle(id);
      await persist();
      rebuild();
    }

renderer.domElement.addEventListener("pointermove", (ev) => {

  if (!plan) return;
  const dx = ev.clientX - dragMove.startClientX;
  const dy = ev.clientY - dragMove.startClientY;
  if (!dragMove.moved && Math.hypot(dx, dy) < 4) return;
  if (!dragMove.historyPushed) {
    pushHistory();
    dragMove.historyPushed = true;
  }
  if (!dragMove.startPlan) dragMove.startPlan = plan;
  dragMove.moved = true;
  const primary = dragMove.members.find((m) => m.kind === dragMove.kind && m.id === dragMove.id) || dragMove.members[0];
  if (!primary) return;
  const want = {
    x: primary.origX + (plan.x - dragMove.startPlan.x),
    y: primary.origY + (plan.y - dragMove.startPlan.y),
  };
  const primaryObj = findDocObj(primary.kind, primary.id);
  if (!primaryObj) return;
  const walls = wallNet.length ? wallNet : (doc?.walls || []);
  const resolved = resolveMove({
    doc,
    kind: primary.kind,
    obj: primaryObj,
    fromX: primaryObj.x,
    fromY: primaryObj.y,
    toX: want.x,
    toY: want.y,
    walls,
    stickyRoom: primary.stickyRoom,
    ignoreIds: dragMove.ignoreIds,
    snapFn: snapPlan,
  });

  const ddy = resolved.y - primary.origY;

    const o = findDocObj(m.kind, m.id);
    if (!o) return;
    const nx = m.origX + ddx;
    const ny = m.origY + ddy;

      from: { x: o.x, y: o.y },
      stickyRoom: m.stickyRoom,
      ignoreIds: dragMove.ignoreIds,
