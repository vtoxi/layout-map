window.addEventListener("keydown", async (e) => {
  if (!doc) return;
  const tag = (e.target && e.target.tagName) || "";
  const typing = tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA";
  const meta = e.metaKey || e.ctrlKey;
  if (meta && e.key.toLowerCase() === "s") {
    e.preventDefault();
    await saveShared3d();
    return;
  }
  if (meta && e.key.toLowerCase() === "z" && e.shiftKey) {
    e.preventDefault();
    redo();
    return;
  }
  if (meta && e.key.toLowerCase() === "z") {
    e.preventDefault();
    undo();
    return;
  }
  if (meta && e.key.toLowerCase() === "y") {
    e.preventDefault();
    redo();
    return;
  }
  if (typing) return;
  if (meta && e.key.toLowerCase() === "a") {
    e.preventDefault();
    // select all movable
    selection = [];
    for (const c of doc.cabinets || []) selection.push({ kind: "cabinet", id: c.id });
    for (const l of doc.lights || []) selection.push({ kind: "light", id: l.id });
    for (const f of doc.fans || []) selection.push({ kind: "fan", id: f.id });
    for (const sck of doc.sockets || []) selection.push({ kind: "socket", id: sck.id });
    updateSelectRings();
    renderPanel();
    toast(`Selected ${selection.length}`);
    return;
  }
  if (meta && e.key.toLowerCase() === "c" && selection.length) {
    e.preventDefault();
    copySelected3d();
    renderPanel();
    return;
  }
  if (meta && e.key.toLowerCase() === "v") {
    e.preventDefault();
    await pasteClipboard3d();
    return;
  }
  if (meta && e.key.toLowerCase() === "d" && selection.length) {
    e.preventDefault();
    await duplicateSelected3d();
    return;
  }
  if (e.key === "Escape") {
    e.preventDefault();
    const openMenu = panel.querySelector(".menu.open");
    if (openMenu) { openMenu.classList.remove("open"); return; }
    if (cancelDragMove3d()) return;
    hideCtxMenu();
    if (selection.length) setSelected(null, null);
    return;
  }
  if (!selection.length) return;
  if (e.key === "Delete" || e.key === "Backspace") {
    e.preventDefault();
    await deleteSelected3d();
    return;
  }
  const step = (e.shiftKey ? 5 : 1) * (doc.snapMm || 50);
  if (e.key === "ArrowUp") { e.preventDefault(); await nudgeSelected3d(0, step); }
  else if (e.key === "ArrowDown") { e.preventDefault(); await nudgeSelected3d(0, -step); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); await nudgeSelected3d(-step, 0); }
  else if (e.key === "ArrowRight") { e.preventDefault(); await nudgeSelected3d(step, 0); }
  else if (e.key === "[") { e.preventDefault(); await rotateSelected3d(-15); }
  else if (e.key === "]") { e.preventDefault(); await rotateSelected3d(15); }
});

function readDraft() {
  try {
    return JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
  } catch {
    return null;
  }
}

function docKey(d, source, draftSavedAt = 0) {
  const wallsSig = (d?.walls || [])
    .map((w) => `${w.id}:${Math.round(w.a?.x)},${Math.round(w.a?.y)}-${Math.round(w.b?.x)},${Math.round(w.b?.y)}:${w.height||""}`)
    .join(";");
  const roomsSig = (d?.rooms || [])
    .map((r) => `${r.id}:${(r.points || []).map((p) => `${Math.round(p.x)},${Math.round(p.y)}`).join("/")}`)
    .join(";");
  return [
    source,
    draftSavedAt,
    d?.updatedAt || "",
    d?.flooring || "",
    wallsSig,
    roomsSig,
    (d?.doors || []).length,
    (d?.windows || []).map((w) => `${w.id}:${w.style}:${w.open?1:0}`).join(","),
    (d?.openings || []).length,
  ].join("|");
}

function setHud(source, d) {
  const el = document.getElementById("hudMeta");
  if (!el) return;
  const nW = (d?.walls || []).length;
  const nR = (d?.rooms || []).length;
  const when = d?.updatedAt ? new Date(d.updatedAt).toLocaleString() : "";
  if (VIEW_MODE || SHARE_TOKEN) {
    el.innerHTML = `<strong>${activeModel?.name || "Shared preview"}</strong> · read-only · ${nW} walls · ${nR} rooms`;
    return;
  }
  el.innerHTML = `${source} · ${nW} walls · ${nR} rooms${when ? ` · ${when}` : ""}. <a href="./index.html">← CAD editor</a>`;
  if (activeModel) {
    el.innerHTML = `<strong>${activeModel.name}</strong> · ${nW} walls · ${nR} rooms · ${(activeModel.versions||[]).length} ver. <a href="./index.html">← CAD</a>`;
  }
}

async function load({ forceFit = false } = {}) {
  try {
    if (SHARE_TOKEN) {
      const data = await Models.getShare(SHARE_TOKEN);
      adoptDoc(data.doc);
      activeModel = { id: data.model?.id, name: data.model?.name || "Shared preview", versions: [] };
      loadSource = "share";
      lastDocKey = docKey(doc, "share", 0);
      rebuild(forceFit || true);
      applyState();
      setHud("Shared link", doc);
      renderPanel();
      syncHudMode();
      return;
    }
    Models.ensureUser();
    const { model, doc: remote, models } = await Models.loadActiveModel();
    activeModel = model;
    modelsCache = models || [];
    DRAFT_KEY = Models.draftKeyForModel(activeModel?.id);
    const draftWrap = readDraft();
    const sharedT = Date.parse(remote?.updatedAt || 0) || 0;
    const draftT = draftWrap?.savedAt || 0;

    let next = remote;
    let source = activeModel?.name || "model";
    let usedDraftAt = 0;
    if (!VIEW_MODE && draftWrap?.doc && draftT > sharedT + 2000) {
      next = draftWrap.doc;
      source = `${activeModel?.name || "model"} (local draft)`;
      usedDraftAt = draftT;
    }

    const key = docKey(next, source, usedDraftAt);
    const changed = key !== lastDocKey;
    adoptDoc(next);
    if (changed || forceFit) {
      history = [];
      future = [];
      dirty = source.includes("draft");
    }
    loadSource = source;
    if (doc?.site) {
      dayCycle.lat = doc.site.lat ?? dayCycle.lat;
      dayCycle.lon = doc.site.lon ?? dayCycle.lon;
      dayCycle.preset = doc.site.preset || dayCycle.preset;
      if (doc.site.dayOfYear) dayCycle.dayOfYear = doc.site.dayOfYear;
      if (doc.site.syncRealtime != null) dayCycle.syncRealtime = !!doc.site.syncRealtime;
    }
    setHud(loadSource, doc);
    rebuild(forceFit || changed);
    updateDayCycle();
    renderPanel();
    lastDocKey = key;
  } catch (err) {
    console.warn(err);
    panel.innerHTML = `<p>Could not load model. Open the <a href="./index.html" style="color:#5b9fd4">CAD editor</a> and create a model, or run <code>node server.mjs</code>.</p>`;
  }
}

/** Fold pose easing + cloth airflow (fans / open windows). */
function updateCurtains(dt) {
  curtainAnimT += dt;
  const t = curtainAnimT;
  const cabs = doc?.cabinets || [];

  if (curtainDemo) {
    curtainDemoT += dt;
    const period = 9;
    const phase = (curtainDemoT % period) / period;
    let a = 0;
    if (phase < 0.4) a = phase / 0.4;
    else if (phase < 0.55) a = 1;
    else a = 1 - (phase - 0.55) / 0.45;
    for (const c of cabs) {
      if (!isCurtainFurn(c.type)) continue;
      c.open = a > 0.5;
      curtainAnim[c.id] = a;
      const m = curtainMeshes[c.id];
      if (m) applyCurtainPose(m, a);
    }
  } else {
    for (const c of cabs) {
      if (!isCurtainFurn(c.type)) continue;
      const target = c.open ? 1 : 0;
      const cur = curtainAnim[c.id] ?? 0;
      const next = cur + (target - cur) * 0.045;
      if (Math.abs(next - cur) > 0.0004 || Math.abs(next - target) > 0.001) {
        curtainAnim[c.id] = next;
        const m = curtainMeshes[c.id];
        if (m) applyCurtainPose(m, next);
      } else if (Math.abs(cur - target) > 0.0001) {
        curtainAnim[c.id] = target;
        const m = curtainMeshes[c.id];
        if (m) applyCurtainPose(m, target);
      }
    }
  }

  // Cloth airflow on top of fold pose
  const fansOn = cabs.length ? (doc.fans || []).filter((f) => f.on) : [];
  const openWins = (doc?.windows || []).filter((w) => {
    if (w.style === "fixed") return false;
    const a = windowAnim[w.id];
    return (a != null ? a : (w.open ? 1 : 0)) > 0.08;
  });
  if (!fansOn.length && !openWins.length) {
    // Still subtle idle sway when fully closed cloth hangs
  }

  const world = new THREE.Vector3();
  for (const entry of Object.values(curtainMeshes)) {
    if (!entry.cloth?.length) continue;
    entry.group.getWorldPosition(world);
    const cos = Math.cos(entry.group.rotation.y);
    const sin = Math.sin(entry.group.rotation.y);

    for (const p of entry.cloth) {
      const { mesh, rest, side, panelW, panelH, sheer, drawT } = p;
      const localX = mesh.position.x;
      const cx = world.x + localX * cos;
      const cz = world.z - localX * sin;

      let windLocalX = 0;
      let windLocalZ = 0;
      let intensity = 0;

      for (const f of fansOn) {
        const fx = px(f.x);
        const fz = pz(f.y);
        const dx = cx - fx;
        const dz = cz - fz;
        const dist = Math.hypot(dx, dz) || 0.01;
        const reach = 2.2 + ((f.diameterMm || 1200) * M) * 1.8;
        if (dist > reach) continue;
        const fall = (1 - dist / reach);
        const power = ((f.speed || 2) / 3) * fall * fall * (sheer ? 1.25 : 1);
        const wx = (dx / dist) * power;
        const wz = (dz / dist) * power;
        windLocalX += wx * cos + wz * sin;
        windLocalZ += -wx * sin + wz * cos;
        windLocalZ += power * 0.35;
        intensity += power;
      }

      for (const w of openWins) {
        const wm = windowMeshes[w.id];
        if (!wm?.group) continue;
        const openAmt = windowAnim[w.id] ?? (w.open ? 1 : 0);
        const wpos = wm.group.position;
        const dx = cx - wpos.x;
        const dz = cz - wpos.z;
        const dist = Math.hypot(dx, dz) || 0.01;
        const reach = 4.5;
        if (dist > reach) continue;
        const toWinLocalX = (wpos.x - world.x) * cos + (wpos.z - world.z) * sin;
        const sideBias = toWinLocalX * side > 0 ? 1.35 : 0.45;
        const fall = (1 - dist / reach);
        const power = openAmt * fall * fall * 1.1 * sideBias * (sheer ? 1.2 : 1);
        const nang = wm.group.rotation.y;
        const nx = Math.sin(nang);
        const nz = Math.cos(nang);
        const inward = dx * nx + dz * nz;
        const sx = inward >= 0 ? nx : -nx;
        const sz = inward >= 0 ? nz : -nz;
        const wx = sx * power;
        const wz = sz * power;
        windLocalX += wx * cos + wz * sin;
        windLocalZ += -wx * sin + wz * cos;
        intensity += power;
      }

      const ambient = intensity > 0.02 ? 0.15 : 0.04;
      const amp = Math.min(1.6, intensity + ambient);
      const pos = mesh.geometry.attributes.position;
      const pinTop = panelH * 0.48;
      const pleatBoost = 1 + (drawT || 0) * 1.8;
      const invScale = 1 / Math.max(0.15, mesh.scale.x);

      for (let i = 0; i < pos.count; i++) {
        const rx = rest[i * 3];
        const ry = rest[i * 3 + 1];
        const rz = rest[i * 3 + 2] * pleatBoost;
        const hang = Math.max(0, (pinTop - ry) / panelH);
        const hang2 = hang * hang;
        const u = rx / panelW;
        const speed = 1.6 + amp * 2.4;
        const phase = t * speed + u * 9 + side * 1.7 + ry * 2.2;
        const flutter =
          Math.sin(phase) * 0.012 +
          Math.sin(phase * 1.73 + 0.4) * 0.007 +
          Math.sin(phase * 0.55 + u * 4) * 0.005;
        const blowZ = windLocalZ * hang2 * 0.14 + flutter * amp * hang;
        const swayX = (windLocalX * hang2 * 0.1 + flutter * 0.35 * amp * hang * side) * invScale;
        const edge = 1 + (drawT || 0) * Math.abs(u) * 0.8;
        pos.setX(i, rx + swayX * edge);
        pos.setY(i, ry);
        pos.setZ(i, rz + blowZ * edge);
      }
      pos.needsUpdate = true;
      if (((curtainAnimT * 60) | 0) % 2 === 0) mesh.geometry.computeVertexNormals();
    }
  }
}

function tick() {
  const doors = doc?.doors || [];
  const wins = doc?.windows || [];

  if (doorDemo && doors.length) {
    doorDemoT += 1 / 60;
    const period = 8;
    const phase = (doorDemoT % period) / period;
    let amt = 0;
    if (phase < 0.4) amt = phase / 0.4;
    else if (phase < 0.55) amt = 1;
    else amt = 1 - (phase - 0.55) / 0.45;
    for (let i = 0; i < doors.length; i++) {
      const d = doors[i];
      const shift = (i * 0.12) % 1;
      const p2 = (phase + shift) % 1;
      let a = 0;
      if (p2 < 0.4) a = p2 / 0.4;
      else if (p2 < 0.55) a = 1;
      else a = 1 - (p2 - 0.55) / 0.45;
      d.open = a > 0.5;
      const cur = doorAnim[d.id] ?? 0;
      doorAnim[d.id] = cur + (a - cur) * 0.06;
      applyDoorPose(doorMeshes[d.id], doorAnim[d.id]);
    }
  } else {
    for (const d of doors) {
      const target = d.open ? 1 : 0;
      const cur = doorAnim[d.id] ?? 0;
      const next = cur + (target - cur) * 0.055;
      if (Math.abs(next - cur) > 0.0004 || Math.abs(next - target) > 0.001) {
        doorAnim[d.id] = next;
        applyDoorPose(doorMeshes[d.id], next);
      } else if (Math.abs(cur - target) > 0.0001) {
        doorAnim[d.id] = target;
        applyDoorPose(doorMeshes[d.id], target);
      }
    }
  }

  // Slow demo: cycle each style group open/closed over ~8s
  if (windowDemo && wins.length) {
    windowDemoT += 1 / 60;
    const period = 10; // seconds full open+close
    const phase = (windowDemoT % period) / period;
    // Stagger by style so different motions are visible at different times
    const stylePhase = {
      sliding: 0,
      casement: 0.2,
      awning: 0.4,
      double: 0.6,
      fixed: 0,
    };
    for (const w of wins) {
      if (w.style === "fixed") { w.open = false; continue; }
      const shift = stylePhase[w.style] ?? 0;
      const p2 = (phase + shift) % 1;
      let a = 0;
      if (p2 < 0.45) a = p2 / 0.45;
      else if (p2 < 0.55) a = 1;
      else a = 1 - (p2 - 0.55) / 0.45;
      w.open = a > 0.5;
      const cur = windowAnim[w.id] ?? 0;
      windowAnim[w.id] = cur + (a - cur) * 0.04;
      const m = windowMeshes[w.id];
      if (m) applyWindowPose(m, windowAnim[w.id]);
    }
  } else {
    // Normal: ease toward open/closed
    for (const w of wins) {
      const target = w.open && w.style !== "fixed" ? 1 : 0;
      const cur = windowAnim[w.id] ?? 0;
      const next = cur + (target - cur) * 0.035;
      if (Math.abs(next - cur) > 0.0005 || Math.abs(next - target) > 0.001) {
        windowAnim[w.id] = next;
        const m = windowMeshes[w.id];
        if (m) applyWindowPose(m, next);
      } else if (Math.abs(cur - target) > 0.0001) {
        windowAnim[w.id] = target;
        const m = windowMeshes[w.id];
        if (m) applyWindowPose(m, target);
      }
    }
  }

  for (const f of doc?.fans || []) {
    const m = fanMeshes[f.id];
    if (f.on && m?.rotor) m.rotor.rotation.y += 0.06 * (f.speed || 2);
  }
  updateCurtains(1 / 60);
  updateDayCycle();
  updateViewAnim(performance.now());
  if (walkthrough?.active) {
    walkthrough.update(performance.now());
  } else if (!viewAnim) {
    controls.update();
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
await load({ forceFit: true }).catch((err) => {
  console.warn(err);
  toast(String(err.message || err), "err");
  if (SHARE_TOKEN) {
    panel.innerHTML = `<div class="panel-head"><h1>Link unavailable</h1></div>
      <div class="panel-scroll" style="padding:14px">
        <p style="color:#f0c0c0">${String(err.message || "Share not found")}</p>
        <p style="color:var(--muted);font-size:12px;margin-top:12px">The link may be revoked or expired.</p>
      </div>`;
  }
});

const liveSyncInst = createLiveSync({
  modelId: Models.getActiveModelId(),
  onRemote(remoteDoc, meta) {
    if (VIEW_MODE || SHARE_TOKEN) return;
    if (!remoteDoc || meta?.source === "3d") return;
    if (dirty) return;
    adoptDoc(remoteDoc);
    rebuild();
    renderPanel();
    toast("Synced from CAD");
  },
});
liveSync = liveSyncInst;
liveSync.setModelId(activeModel?.id || Models.getActiveModelId());

async function ensureWalkthrough() {
  if (walkthrough) return walkthrough;
  if (walkLoading) return null;
  walkLoading = true;
  syncHudMode();
  try {
    const { createWalkthrough } = await import("./walkthrough.js");
    walkthrough = createWalkthrough({
      camera,
      dom: renderer.domElement,
      getDoc: () => doc,
      getWalls: () => (wallNet.length ? wallNet : (doc?.walls || [])),
      onModeChange(active) {
        controls.enabled = !active;
        if (active && !VIEW_MODE) setLayoutLocked(true);
        syncHudMode();
        if (!active) setInteractHint(null);
        toast(active
          ? "Walk · WASD · look · [ ] FOV · Esc exit"
          : "Orbit mode");
      },
      onFovChange(mode) {
        syncHudMode();
        if (walkthrough?.active && mode) {
          toast(`FOV · ${mode.label} ${mode.fov}°`);
        }
      },
      onHint(text) {
        if (text) toast(text);
      },
      onNearbyChange(device) {
        setInteractHint(device);
      },
      onToggleActuator(device) {
        if (!device || !doc) return;
        pushHistory();
        const needRebuild = toggleObject(device.kind, device.id);
        persist().then(() => {
          if (needRebuild) rebuild();
          else { applyState(); renderPanel(); }
          const next = walkthrough?.nearby;
          setInteractHint(next || null);
          const state = next ? (next.open ? "Open" : "Closed") : "";
          toast(`${device.label}${state ? " · " + state : ""}`);
        });
      },
    });
    return walkthrough;
  } catch (err) {
    console.error(err);
    toast("Could not start walkthrough", "err");
    return null;
  } finally {
    walkLoading = false;
    syncHudMode();
  }
}
syncHudMode();
if (VIEW_MODE || SHARE_TOKEN) {
  document.getElementById("shareWatermark")?.removeAttribute("hidden");
  setLayoutLocked(true);
}
setViewGizmoEnabled(viewGizmoOn, { quiet: true });
ensureOhClient3d();
ensureOhClient3d().refreshStatus().then(() => syncHudMode()).catch(() => {});

document.getElementById("app")?.addEventListener("click", async (e) => {
  const fovBtn = e.target.closest("[data-act=cycle-walk-fov]");
  if (fovBtn) {
    walkthrough?.cycleFovMode?.(1);
    return;
  }
  const btn = e.target.closest("[data-act=toggle-walk]");
  if (!btn) return;
  const wt = await ensureWalkthrough();
  if (!wt) return;
  if (!wt.canWalk()) {
    toast("Add rooms or walls before walking", "err");
    return;
  }
  wt.toggle();
});

tick();

window.addEventListener("focus", () => { if (!SHARE_TOKEN) load(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !SHARE_TOKEN) load();
});
  </script>
